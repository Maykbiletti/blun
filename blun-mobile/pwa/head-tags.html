<!-- PWA Head-Tags — in index.html <head> einfuegen -->

<!-- Manifest -->
<link rel="manifest" href="/manifest.json">

<!-- Theme -->
<meta name="theme-color" content="#1a1a2e">
<meta name="background-color" content="#0f0f23">

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BLUN">
<link rel="apple-touch-icon" href="/icons/icon-192.png">

<!-- Preconnect -->
<link rel="preconnect" href="https://blun.ai" crossorigin>

<!-- DNS Prefetch fuer API -->
<link rel="dns-prefetch" href="https://api.blun.ai">

<!-- Preload kritische Assets -->
<link rel="preload" href="/icons/icon-192.png" as="image" type="image/png">
