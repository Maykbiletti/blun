<!DOCTYPE html>
<html lang="de">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="rLDlUP_U15jNWjucswiqKuhWk-hj0-NdAbYKlz7ivO4" />
<title>BLUN - Anmelden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e5e5e5;font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{width:100%;max-width:400px;padding:1.5rem}
.back-link{display:inline-flex;align-items:center;gap:.4rem;color:#737373;font-size:.85rem;text-decoration:none;margin-bottom:1.5rem;transition:color .2s}
.back-link:hover{color:#3b82f6}
.logo{text-align:center;margin-bottom:2rem}
.logo h1{font-size:2.2rem;font-weight:700;color:#fff;letter-spacing:-.03em}
.logo p{color:#737373;font-size:.85rem;margin-top:.25rem}
.card{background:#1a1a1a;border:1px solid #262626;border-radius:12px;padding:1.75rem}
.tabs{display:flex;margin-bottom:1.5rem;background:#0a0a0a;border-radius:8px;padding:3px}
.tab{flex:1;padding:.6rem;text-align:center;font-size:.9rem;font-weight:500;color:#737373;border:none;background:none;cursor:pointer;border-radius:6px;transition:all .2s}
.tab.active{background:#262626;color:#fff}
.field{margin-bottom:1rem}
.field label{display:block;font-size:.8rem;color:#a3a3a3;margin-bottom:.4rem;font-weight:500}
.field input{width:100%;padding:.7rem .85rem;background:#0a0a0a;border:1px solid #262626;border-radius:8px;color:#fff;font-size:.9rem;outline:none;transition:border-color .2s}
.field input:focus{border-color:#3b82f6}
.field input::placeholder{color:#525252}
.pw-wrapper{position:relative}
.pw-wrapper input{padding-right:2.5rem}
.pw-toggle{position:absolute;right:.7rem;top:50%;transform:translateY(-50%);background:none;border:none;color:#525252;cursor:pointer;font-size:.8rem;padding:.2rem;transition:color .2s}
.pw-toggle:hover{color:#a3a3a3}
.btn-submit{width:100%;padding:.8rem;background:#3b82f6;color:#fff;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;margin-top:.5rem;transition:background .2s}
.btn-submit:hover{background:#2563eb}
.btn-submit:disabled{opacity:.5;cursor:not-allowed}
.divider{display:flex;align-items:center;gap:.75rem;margin:1.25rem 0;color:#525252;font-size:.75rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#262626}
.btn-oauth{width:100%;padding:.65rem;background:#141414;border:1px solid #262626;border-radius:8px;color:#e5e5e5;font-size:.8rem;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.5rem;margin-bottom:.5rem;transition:border-color .2s}
.btn-oauth:hover{border-color:#404040}
.error-msg{background:#451a03;border:1px solid #92400e;color:#fbbf24;padding:.65rem .85rem;border-radius:8px;font-size:.8rem;margin-bottom:1rem;display:none}
.forgot{text-align:center;margin-top:1rem}
.forgot a{color:#737373;font-size:.8rem;text-decoration:none;transition:color .2s}
.forgot a:hover{color:#3b82f6}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
  <a href="/" class="back-link">&larr; Zurueck zur Startseite</a>
  <div class="logo">
    <h1><span style="color:#fff">BL</span><span style="color:#3b82f6">UN</span></h1>
    <p>AI Organisator</p>
  </div>
  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tabLogin" onclick="switchTab('login')">Anmelden</button>
      <button class="tab" id="tabRegister" onclick="switchTab('register')">Registrieren</button>
    </div>
    <div id="error" class="error-msg"></div>
    <form id="authForm" onsubmit="handleSubmit(event)">
      <div id="nameField" class="field hidden">
        <label>Name</label>
        <input type="text" id="name" placeholder="Dein Name" autocomplete="name">
      </div>
      <div class="field">
        <label>E-Mail</label>
        <input type="email" id="email" placeholder="deine@email.com" required autocomplete="email">
      </div>
      <div class="field">
        <label>Passwort</label>
        <div class="pw-wrapper">
          <input type="password" id="password" placeholder="Mindestens 8 Zeichen" required autocomplete="current-password" minlength="8">
          <button type="button" class="pw-toggle" onclick="togglePw()" title="Passwort anzeigen">Zeigen</button>
        </div>
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">Anmelden</button>
    </form>
    <div class="forgot" id="forgotLink"><a href="#">Passwort vergessen?</a></div>
    <div class="divider">oder</div>
  </div>
</div>
<script>
var mode = 'login';
function switchTab(m) {
  mode = m;
  document.getElementById('tabLogin').classList.toggle('active', m === 'login');
  document.getElementById('tabRegister').classList.toggle('active', m === 'register');
  document.getElementById('nameField').classList.toggle('hidden', m === 'login');
  document.getElementById('submitBtn').textContent = m === 'login' ? 'Anmelden' : 'Registrieren';
  document.getElementById('forgotLink').style.display = m === 'login' ? '' : 'none';
  document.getElementById('error').style.display = 'none';
}
function togglePw() {
  var inp = document.getElementById('password');
  var btn = inp.parentElement.querySelector('.pw-toggle');
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = 'Verbergen'; }
  else { inp.type = 'password'; btn.textContent = 'Zeigen'; }
}
function showError(msg) {
  var el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
}
async function handleSubmit(e) {
  e.preventDefault();
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  document.getElementById('error').style.display = 'none';
  var body = { email: document.getElementById('email').value.trim(), password: document.getElementById('password').value };
  if (mode === 'register') {
    var nameVal = document.getElementById('name').value.trim();
    if (!nameVal) { showError('Bitte gib deinen Namen ein.'); btn.disabled = false; return; }
    body.name = nameVal;
  }
  try {
    var res = await fetch('/auth/' + mode, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify(body) });
    var data = await res.json();
    if (!res.ok) {
      var msg = data.error || 'Etwas ist schiefgelaufen.';
      if (msg === 'Invalid email or password') msg = 'E-Mail oder Passwort falsch.';
      if (msg === 'Email already registered') msg = 'Diese E-Mail ist bereits registriert.';
      if (msg === 'Email, password, and name are required') msg = 'Bitte alle Felder ausfuellen.';
      if (msg === 'Password must be at least 8 characters') msg = 'Passwort muss mindestens 8 Zeichen haben.';
      showError(msg);
      btn.disabled = false;
      return;
    }
    if(data.token) localStorage.setItem('blun_token', data.token);
    window.location.href = '/dashboard';
  } catch (err) {
    showError('Verbindungsfehler. Bitte erneut versuchen.');
    btn.disabled = false;
  }
}
fetch('/auth/me', { credentials: 'include' })
  .then(function(r) { if (r.ok) window.location.href = '/dashboard'; })
  .catch(function() {});
window.addEventListener('DOMContentLoaded', function() { document.getElementById('email').focus(); });
</script>
</body>
</html>
