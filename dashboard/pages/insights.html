<div class="page-frag" data-page-slug="insights">
  <div style="font-size:20px;font-weight:700;color:var(--tx);margin-bottom:16px">Insights</div>
  <div class="card" style="margin-bottom:12px">
    <div class="card-head"><div class="card-title">Zusammenfassung</div></div>
    <div style="color:var(--tx2);font-size:13px;line-height:1.6">Hier siehst du Trends und Auffaelligkeiten aus dem letzten Zeitraum. Daten werden live aus den Agent-Tasks aggregiert.</div>
  </div>
  <div class="stats-row" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
    <div class="stat-card"><div class="stat-label">Avg. Task Dauer</div><div class="stat-val" id="inAvg">–</div></div>
    <div class="stat-card"><div class="stat-label">Erfolgsrate</div><div class="stat-val" id="inRate">–</div></div>
    <div class="stat-card"><div class="stat-label">Aktivste Stunde</div><div class="stat-val" id="inHour">–</div></div>
  </div>
</div>
<script>
(function(){
  if(typeof api!=='function') return;
  api('/api/organisator/insights').then(function(d){
    var set=function(id,v){var e=document.getElementById(id); if(e) e.textContent=v;};
    if(d){ set('inAvg',(d.avg_duration||'–')+' min'); set('inRate',((d.success_rate||0)*100).toFixed(0)+'%'); set('inHour',d.peak_hour||'–'); }
  }).catch(function(){});
})();
</script>
