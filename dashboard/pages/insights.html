<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insights | BLUN Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --tile: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent-1: #22d3ee;
      --accent-2: #34d399;
      --accent-3: #f59e0b;
      --accent-4: #f472b6;
      --border: #374151;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", "Inter", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 0% 0%, #1d4ed8 0%, transparent 30%),
        radial-gradient(circle at 100% 100%, #7c3aed 0%, transparent 30%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .insights {
      width: min(1080px, 100%);
      background: linear-gradient(145deg, rgba(17, 24, 39, 0.92), rgba(15, 23, 42, 0.95));
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      backdrop-filter: blur(6px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .heading h1 {
      font-size: clamp(1.4rem, 2.6vw, 2rem);
      letter-spacing: 0.02em;
    }

    .heading p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 16px;
    }

    .kpi-tile {
      background: var(--tile);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 140px;
    }

    .kpi-label {
      color: var(--muted);
      font-size: 0.84rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .kpi-value {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      line-height: 1;
      font-weight: 700;
    }

    .kpi-note {
      font-size: 0.86rem;
      color: #cbd5e1;
      margin-top: auto;
    }

    .tile-today .kpi-value { color: var(--accent-1); }
    .tile-completed .kpi-value { color: var(--accent-2); }
    .tile-online .kpi-value { color: var(--accent-3); }
    .tile-queue .kpi-value { color: var(--accent-4); }

    @media (max-width: 980px) {
      .kpi-grid {
        grid-template-columns: repeat(2, minmax(180px, 1fr));
      }
    }

    @media (max-width: 560px) {
      body {
        padding: 16px;
      }

      .insights {
        padding: 18px;
      }

      .kpi-grid {
        grid-template-columns: 1fr;
      }

      .kpi-tile {
        min-height: 120px;
      }
    }
  </style>
</head>
<body>
  <main class="insights">
    <header class="heading">
      <h1>Operational Insights</h1>
      <p>Stand: 11. April 2026, 11:55 CET</p>
    </header>

    <section class="kpi-grid" aria-label="KPI Uebersicht">
      <article class="kpi-tile tile-today">
        <div class="kpi-label">Tasks Heute</div>
        <div class="kpi-value">128</div>
        <div class="kpi-note">+14% vs. Tagesstart</div>
      </article>

      <article class="kpi-tile tile-completed">
        <div class="kpi-label">Completed Gestern</div>
        <div class="kpi-value">342</div>
        <div class="kpi-note">Peak zwischen 14:00 und 16:00</div>
      </article>

      <article class="kpi-tile tile-online">
        <div class="kpi-label">Agents Online</div>
        <div class="kpi-value">27</div>
        <div class="kpi-note">4 im Warm-Standby</div>
      </article>

      <article class="kpi-tile tile-queue">
        <div class="kpi-label">Queue Pending</div>
        <div class="kpi-value">19</div>
        <div class="kpi-note">SLA innerhalb Zielkorridor</div>
      </article>
    </section>
  </main>
</body>
</html>
