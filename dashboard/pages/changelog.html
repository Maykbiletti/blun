<div class="page-frag" data-page-slug="changelog">
  <div style="font-size:20px;font-weight:700;color:var(--tx);margin-bottom:16px">Changelog</div>
  <div class="card">
    <div id="clList" style="color:var(--tx)">Lade…</div>
  </div>
</div>
<script>
(function(){
  if(typeof api!=='function') return;
  api('/api/organisator/changelog').then(function(d){
    var list=Array.isArray(d)?d:(d&&d.items)||[];
    var el=document.getElementById('clList');
    if(!el) return;
    if(!list.length){ el.innerHTML='<div style="color:var(--tx2)">Keine Eintraege.</div>'; return; }
    el.innerHTML=list.map(function(it){return '<div style="padding:10px 0;border-bottom:1px solid var(--brd)"><div style="font-size:13px;color:var(--tx2)">'+(it.date||'')+' <span class="tag">'+(it.type||'change')+'</span></div><div style="font-size:14px;color:var(--tx);margin-top:4px">'+(it.title||it.message||'')+'</div></div>'}).join('');
  }).catch(function(){
    var el=document.getElementById('clList'); if(el) el.innerHTML='<div style="color:var(--tx2)">Keine Daten.</div>';
  });
})();
</script>
