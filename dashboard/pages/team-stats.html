<div class="page-frag" data-page-slug="team-stats">
  <div style="font-size:20px;font-weight:700;color:var(--tx);margin-bottom:16px">Team Statistik</div>
  <div class="stats-row" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px">
    <div class="stat-card"><div class="stat-label">Agents</div><div class="stat-val" id="tsAgents">–</div></div>
    <div class="stat-card"><div class="stat-label">Tasks gesamt</div><div class="stat-val" id="tsTasks">–</div></div>
    <div class="stat-card"><div class="stat-label">Erledigt heute</div><div class="stat-val" id="tsDone">–</div></div>
    <div class="stat-card"><div class="stat-label">Offen</div><div class="stat-val" id="tsOpen">–</div></div>
  </div>
  <div class="card">
    <div class="card-head"><div class="card-title">Top Agents</div></div>
    <div id="tsTop" style="color:var(--tx2);font-size:13px">Lade…</div>
  </div>
</div>
<script>
(function(){
  if(typeof api!=='function') return;
  Promise.all([api('/api/organisator/agents'),api('/api/organisator/stats').catch(function(){return{}})]).then(function(r){
    var ags=r[0]||[],s=r[1]||{};
    var set=function(id,v){var e=document.getElementById(id); if(e) e.textContent=v;};
    set('tsAgents',ags.length); set('tsTasks',s.total||'–'); set('tsDone',s.completed_today||'–'); set('tsOpen',s.open||'–');
    var top=document.getElementById('tsTop');
    if(top) top.innerHTML=ags.slice(0,8).map(function(a){return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--brd)"><span>'+a.name+'</span><span class="tag">'+(a.role||'').slice(0,30)+'</span></div>'}).join('');
  });
})();
</script>
