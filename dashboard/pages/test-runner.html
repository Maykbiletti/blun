<div class="page-frag" data-page-slug="test-runner">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <div style="font-size:20px;font-weight:700;color:var(--tx)">Test Runner</div>
    <button class="btn btn-primary" id="trRun">Tests ausfuehren</button>
  </div>
  <div class="card">
    <div class="card-head"><div class="card-title">Letzter Lauf</div></div>
    <div id="trOutput" style="font-family:monospace;font-size:12px;color:var(--tx2);white-space:pre-wrap;min-height:200px">Noch kein Lauf gestartet.</div>
  </div>
</div>
<script>
(function(){
  var btn=document.getElementById('trRun'); if(!btn) return;
  btn.onclick=function(){
    var out=document.getElementById('trOutput'); out.textContent='Laufe…';
    if(typeof api==='function') api('/api/organisator/tests/run',{method:'POST'}).then(function(d){
      out.textContent=(d&&d.output)||'OK';
    }).catch(function(e){ out.textContent='Fehler: '+e.message; });
    else out.textContent='API nicht verfuegbar.';
  };
})();
</script>
