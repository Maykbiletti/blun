<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLUN Test Runner</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070809;
  --bg-card:#121416;
  --border:#21252a;
  --text:#e8eaed;
  --text-dim:#9aa3ad;
  --ok:#22c55e;
  --fail:#ef4444;
  --accent:#3b82f6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Inter",sans-serif;
  background:radial-gradient(circle at 20% -20%,#142031 0%,#070809 45%,#060708 100%);
  color:var(--text);
  min-height:100vh;
  padding:28px 18px 48px;
}
.container{max-width:920px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.title{font-size:26px;font-weight:700;letter-spacing:.2px}
.subtitle{font-size:14px;color:var(--text-dim);margin-top:6px}
.meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 10px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.meta-text{font-size:12px;color:var(--text-dim)}
.actions{display:flex;gap:10px;margin:16px 0 22px;flex-wrap:wrap}
button{
  border:1px solid var(--border);
  background:#181c21;
  color:var(--text);
  border-radius:10px;
  padding:10px 14px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}
button:hover{background:#1e242b}
button.primary{background:#1a3355;border-color:#244d82;color:#dbeafe}
button.primary:hover{background:#22416b}
button:disabled{opacity:.6;cursor:not-allowed}
.card{background:linear-gradient(180deg,#12161b 0%,#101317 100%);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.card-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-head h2{font-size:14px;font-weight:600}
.count{font-size:12px;color:var(--text-dim)}
.list{list-style:none}
.row{padding:14px 16px;border-bottom:1px solid #1b1f24;display:grid;grid-template-columns:92px 1fr auto;gap:12px;align-items:start}
.row:last-child{border-bottom:none}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:66px;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.4px}
.badge.pass{background:rgba(34,197,94,.16);color:#86efac;border:1px solid rgba(34,197,94,.25)}
.badge.fail{background:rgba(239,68,68,.16);color:#fca5a5;border:1px solid rgba(239,68,68,.25)}
.msg{font-size:14px;line-height:1.45;color:#d4d9df;word-break:break-word}
.time{font-size:12px;color:var(--text-dim);white-space:nowrap}
.empty,.error{padding:24px 16px;font-size:14px;color:var(--text-dim)}
.error{color:#fca5a5}
@media (max-width:700px){
  .row{grid-template-columns:1fr;gap:8px}
  .time{white-space:normal}
}
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1 class="title">Test Runner</h1>
        <p class="subtitle">API: <code>/api/test/run</code> • Auto-Refresh alle 30 Sekunden</p>
      </div>
      <div class="meta">
        <span class="pulse" aria-hidden="true"></span>
        <span id="lastUpdate" class="meta-text">Noch kein Lauf</span>
      </div>
    </div>

    <div class="actions">
      <button id="runNow" class="primary">Jetzt ausfuehren</button>
      <button id="toggleRefresh">Auto-Refresh pausieren</button>
    </div>

    <section class="card">
      <div class="card-head">
        <h2>Letzte Test-Ergebnisse</h2>
        <span id="resultCount" class="count">0 / 30</span>
      </div>
      <ul id="resultsList" class="list"></ul>
    </section>
  </div>

<script>
(function(){
  var MAX_RESULTS = 30;
  var INTERVAL_MS = 30000;
  var results = [];
  var isAutoRefresh = true;
  var timer = null;

  function esc(str){
    var div = document.createElement('div');
    div.textContent = String(str == null ? '' : str);
    return div.innerHTML;
  }

  function timeLabel(ts){
    var d = ts ? new Date(ts) : new Date();
    if (isNaN(d.getTime())) d = new Date();
    return d.toLocaleString('de-DE');
  }

  function normalizeBoolean(val){
    if (typeof val === 'boolean') return val;
    if (typeof val === 'number') return val > 0;
    if (typeof val === 'string') {
      var v = val.trim().toLowerCase();
      return v === 'pass' || v === 'passed' || v === 'ok' || v === 'success' || v === 'true';
    }
    return false;
  }

  function toResult(item){
    var pass = normalizeBoolean(item && (
      item.pass ?? item.passed ?? item.ok ?? item.success ?? item.status
    ));
    var message = item && (
      item.message ?? item.msg ?? item.error ?? item.details ?? item.name ?? item.test
    );
    return {
      pass: pass,
      message: message ? String(message) : (pass ? 'Test erfolgreich' : 'Test fehlgeschlagen'),
      timestamp: (item && (item.timestamp ?? item.ts ?? item.time ?? item.createdAt ?? item.created_at)) || Date.now()
    };
  }

  function normalizePayload(payload){
    var candidates = [];

    if (Array.isArray(payload)) {
      candidates = payload;
    } else if (payload && Array.isArray(payload.results)) {
      candidates = payload.results;
    } else if (payload && Array.isArray(payload.tests)) {
      candidates = payload.tests;
    } else if (payload && payload.result && typeof payload.result === 'object') {
      candidates = [payload.result];
    } else if (payload && typeof payload === 'object') {
      candidates = [payload];
    }

    return candidates.map(toResult);
  }

  function render(){
    var list = document.getElementById('resultsList');
    var count = document.getElementById('resultCount');
    count.textContent = results.length + ' / ' + MAX_RESULTS;

    if (!results.length) {
      list.innerHTML = '<li class="empty">Noch keine Testergebnisse vorhanden.</li>';
      return;
    }

    var html = '';
    for (var i = 0; i < results.length; i++) {
      var r = results[i];
      html += ''
        + '<li class="row">'
        + '<span class="badge ' + (r.pass ? 'pass' : 'fail') + '">' + (r.pass ? 'PASS' : 'FAIL') + '</span>'
        + '<div class="msg">' + esc(r.message) + '</div>'
        + '<div class="time">' + esc(timeLabel(r.timestamp)) + '</div>'
        + '</li>';
    }

    list.innerHTML = html;
  }

  function setError(msg){
    var list = document.getElementById('resultsList');
    list.innerHTML = '<li class="error">' + esc(msg) + '</li>';
  }

  function mergeIncoming(incoming){
    if (!incoming.length) return;

    var keySet = Object.create(null);
    var merged = [];

    for (var i = 0; i < incoming.length; i++) {
      var inKey = [incoming[i].pass, incoming[i].message, incoming[i].timestamp].join('|');
      if (!keySet[inKey]) {
        keySet[inKey] = true;
        merged.push(incoming[i]);
      }
    }

    for (var j = 0; j < results.length; j++) {
      var prevKey = [results[j].pass, results[j].message, results[j].timestamp].join('|');
      if (!keySet[prevKey]) {
        keySet[prevKey] = true;
        merged.push(results[j]);
      }
    }

    merged.sort(function(a,b){
      return new Date(b.timestamp).getTime() - new Date(a.timestamp).getTime();
    });

    results = merged.slice(0, MAX_RESULTS);
  }

  function fetchResults(){
    var runBtn = document.getElementById('runNow');
    runBtn.disabled = true;

    return fetch('/api/test/run', { credentials: 'include' })
      .then(function(res){
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(payload){
        var normalized = normalizePayload(payload);
        mergeIncoming(normalized);
        render();
        document.getElementById('lastUpdate').textContent = 'Letztes Update: ' + timeLabel(Date.now());
      })
      .catch(function(err){
        setError('Fehler beim Abruf: ' + err.message);
      })
      .finally(function(){
        runBtn.disabled = false;
      });
  }

  function setAutoRefresh(active){
    isAutoRefresh = active;
    var btn = document.getElementById('toggleRefresh');

    if (timer) {
      clearInterval(timer);
      timer = null;
    }

    if (isAutoRefresh) {
      timer = setInterval(fetchResults, INTERVAL_MS);
      btn.textContent = 'Auto-Refresh pausieren';
    } else {
      btn.textContent = 'Auto-Refresh starten';
    }
  }

  document.getElementById('runNow').addEventListener('click', function(){
    fetchResults();
  });

  document.getElementById('toggleRefresh').addEventListener('click', function(){
    setAutoRefresh(!isAutoRefresh);
  });

  render();
  fetchResults();
  setAutoRefresh(true);
})();
</script>
</body>
</html>
