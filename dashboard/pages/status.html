<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLUN Live Status</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06080d;
      --panel: #111723;
      --panel-soft: #0d1320;
      --text: #edf1ff;
      --muted: #8b96b6;
      --line: #1e283b;
      --online: #23d18b;
      --stopped: #ff5563;
      --unknown: #7e859a;
      --accent: #3b82f6;
      --warn: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      background:
        radial-gradient(1000px 700px at 90% -10%, #1d2c49 0%, transparent 65%),
        radial-gradient(850px 600px at -15% 120%, #18263f 0%, transparent 60%),
        var(--bg);
      padding: 22px;
    }

    .shell {
      width: min(1200px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
    }

    h1 {
      font-size: clamp(1.3rem, 2.3vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.84rem;
      padding: 10px 14px;
      border: 1px solid var(--line);
      background: rgba(17, 23, 35, 0.72);
      border-radius: 12px;
    }

    .pulse {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 rgba(59, 130, 246, 0.4);
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.42); }
      70% { box-shadow: 0 0 0 11px rgba(59, 130, 246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(17, 23, 35, 0.94), rgba(13, 19, 32, 0.92));
      padding: 16px;
    }

    .panel h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: #d9e4ff;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    .proc-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(9, 14, 25, 0.75);
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .proc-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .proc-name {
      font-size: 0.94rem;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #f4f8ff;
    }

    .online { background: color-mix(in oklab, var(--online) 65%, #001611); }
    .stopped { background: color-mix(in oklab, var(--stopped) 75%, #2a0209); }
    .unknown { background: color-mix(in oklab, var(--unknown) 75%, #1e2129); }

    .kv {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(8, 13, 23, 0.74);
      padding: 14px;
      display: grid;
      gap: 8px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }

    .label {
      color: var(--muted);
      font-size: 0.87rem;
    }

    .value {
      font-weight: 700;
      font-size: 1.04rem;
    }

    .bar {
      width: 100%;
      height: 11px;
      border-radius: 999px;
      background: #1a2436;
      overflow: hidden;
      border: 1px solid #212d44;
    }

    .bar-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, #2f90ff, #44b4ff);
      transition: width 0.3s ease;
    }

    .bar-fill.warn {
      background: linear-gradient(90deg, #f7ac2a, #ffcf5c);
    }

    .bar-fill.danger {
      background: linear-gradient(90deg, #ff5d5d, #ff8b8b);
    }

    .error {
      display: none;
      border: 1px solid #59202a;
      background: rgba(89, 32, 42, 0.22);
      color: #ffcdd4;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.86rem;
    }

    .empty {
      border: 1px dashed #2c3852;
      border-radius: 12px;
      color: var(--muted);
      padding: 16px;
      text-align: center;
      background: rgba(10, 15, 25, 0.45);
    }

    @media (max-width: 640px) {
      body { padding: 14px; }
      .header { flex-direction: column; align-items: stretch; }
      .meta { width: fit-content; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <h1>BLUN Live Status</h1>
        <p class="sub">Automatische Aktualisierung alle 5 Sekunden</p>
      </div>
      <div class="meta">
        <span class="pulse" aria-hidden="true"></span>
        <span id="last-update">Warte auf erste Daten...</span>
      </div>
    </header>

    <div id="error" class="error"></div>

    <section class="panel">
      <h2>Prozesse</h2>
      <div id="process-grid" class="cards">
        <div class="empty">Lade Prozessstatus...</div>
      </div>
    </section>

    <section class="panel">
      <h2>System</h2>
      <div class="stats">
        <article class="stat">
          <div class="row">
            <span class="label">Datenbank</span>
            <span id="db-status" class="badge unknown">UNKNOWN</span>
          </div>
          <div class="row">
            <span class="label">Verbindung</span>
            <span id="db-detail" class="value">-</span>
          </div>
        </article>

        <article class="stat">
          <div class="row">
            <span class="label">Festplatte</span>
            <span id="disk-pct" class="value">-</span>
          </div>
          <div class="bar">
            <div id="disk-fill" class="bar-fill"></div>
          </div>
          <div class="row">
            <span id="disk-detail" class="label">-</span>
            <span id="disk-health" class="label">-</span>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var POLL_MS = 5000;
      var processGrid = document.getElementById("process-grid");
      var errorBox = document.getElementById("error");

      function toArray(input) {
        if (Array.isArray(input)) return input;
        if (!input || typeof input !== "object") return [];
        return Object.keys(input).map(function (key) {
          var value = input[key];
          if (value && typeof value === "object") {
            if (!value.name) value.name = key;
            return value;
          }
          return { name: key, status: value };
        });
      }

      function normalizeState(rawState) {
        var value = String(rawState == null ? "" : rawState).toLowerCase();
        if (["online", "running", "up", "healthy", "ok", "connected", "alive"].indexOf(value) !== -1) return "online";
        if (["stopped", "offline", "down", "failed", "error", "dead", "disconnected"].indexOf(value) !== -1) return "stopped";
        return "unknown";
      }

      function extractProcesses(payload) {
        var source = payload.processes || payload.services || payload.agents || payload.workers || payload.system?.processes || payload.status?.processes;
        return toArray(source).map(function (item) {
          var name = item.name || item.process || item.id || item.service || item.worker || "unbenannt";
          var state = normalizeState(item.status || item.state || item.health || item.online);
          var pid = item.pid || item.processId || item.pm_id || item.id;
          var uptime = item.uptime || item.uptimeSeconds || item.uptime_seconds;
          return {
            name: name,
            state: state,
            pid: pid,
            uptime: uptime
          };
        });
      }

      function extractDb(payload) {
        var db = payload.database || payload.db || payload.system?.database || payload.status?.database || {};
        var state = normalizeState(db.status || db.state || db.health || db.connected);
        var detail = db.message || db.detail || (db.connected === true ? "connected" : db.connected === false ? "disconnected" : "-");
        return { state: state, detail: detail };
      }

      function extractDisk(payload) {
        var disk = payload.disk || payload.storage || payload.system?.disk || payload.status?.disk || {};
        var used = Number(disk.usedPercent || disk.usagePercent || disk.percent || disk.used_pct || 0);
        if (Number.isNaN(used)) used = 0;
        used = Math.max(0, Math.min(100, Math.round(used)));
        var usedValue = disk.used || disk.usedGb || disk.used_gb;
        var totalValue = disk.total || disk.totalGb || disk.total_gb;
        return {
          usedPercent: used,
          usedValue: usedValue,
          totalValue: totalValue
        };
      }

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function renderProcesses(processes) {
        if (!processes.length) {
          processGrid.innerHTML = '<div class="empty">Keine Prozesse gefunden</div>';
          return;
        }

        processGrid.innerHTML = processes.map(function (proc) {
          var details = [];
          if (proc.pid !== undefined && proc.pid !== null && proc.pid !== "") {
            details.push("PID: " + escapeHtml(proc.pid));
          }
          if (proc.uptime !== undefined && proc.uptime !== null && proc.uptime !== "") {
            details.push("Uptime: " + escapeHtml(proc.uptime));
          }

          return [
            '<article class="proc-card">',
            '<div class="proc-head">',
            '<div class="proc-name">' + escapeHtml(proc.name) + '</div>',
            '<span class="badge ' + proc.state + '">' + proc.state + '</span>',
            '</div>',
            '<div class="kv">' + (details.length ? details.map(function (d) { return '<span>' + d + '</span>'; }).join("") : "<span>-</span>") + '</div>',
            '</article>'
          ].join("");
        }).join("");
      }

      function renderDb(db) {
        var badge = document.getElementById("db-status");
        var detail = document.getElementById("db-detail");
        badge.className = "badge " + db.state;
        badge.textContent = db.state.toUpperCase();
        detail.textContent = db.detail || "-";
      }

      function renderDisk(disk) {
        var pct = document.getElementById("disk-pct");
        var fill = document.getElementById("disk-fill");
        var detail = document.getElementById("disk-detail");
        var health = document.getElementById("disk-health");

        pct.textContent = disk.usedPercent + "%";
        fill.style.width = disk.usedPercent + "%";
        fill.className = "bar-fill";
        if (disk.usedPercent >= 85) {
          fill.classList.add("danger");
          health.textContent = "kritisch";
        } else if (disk.usedPercent >= 70) {
          fill.classList.add("warn");
          health.textContent = "beobachten";
        } else {
          health.textContent = "ok";
        }

        if (disk.usedValue != null && disk.totalValue != null) {
          detail.textContent = String(disk.usedValue) + " / " + String(disk.totalValue);
        } else {
          detail.textContent = "Belegung";
        }
      }

      function setLastUpdate() {
        document.getElementById("last-update").textContent = "Letztes Update: " + new Date().toLocaleTimeString("de-DE");
      }

      function showError(message) {
        errorBox.style.display = "block";
        errorBox.textContent = message;
      }

      function clearError() {
        errorBox.style.display = "none";
        errorBox.textContent = "";
      }

      function refresh() {
        fetch("/api/system/status", {
          method: "GET",
          credentials: "include",
          headers: {
            "Accept": "application/json"
          }
        })
          .then(function (response) {
            if (!response.ok) {
              throw new Error("HTTP " + response.status);
            }
            return response.json();
          })
          .then(function (payload) {
            clearError();
            renderProcesses(extractProcesses(payload));
            renderDb(extractDb(payload));
            renderDisk(extractDisk(payload));
            setLastUpdate();
          })
          .catch(function (err) {
            showError("Status konnte nicht geladen werden (" + err.message + ").");
          });
      }

      refresh();
      setInterval(refresh, POLL_MS);
    })();
  </script>
</body>
</html>
