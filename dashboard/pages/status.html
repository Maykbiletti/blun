<div class="page-frag" data-page-slug="status">
  <div style="font-size:20px;font-weight:700;color:var(--tx);margin-bottom:16px">System Status</div>
  <div class="stats-row" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px">
    <div class="stat-card"><div class="stat-label">API</div><div class="stat-val" id="stApi"><span class="status-dot" style="background:var(--green)"></span> OK</div></div>
    <div class="stat-card"><div class="stat-label">Datenbank</div><div class="stat-val" id="stDb"><span class="status-dot" style="background:var(--green)"></span> OK</div></div>
    <div class="stat-card"><div class="stat-label">Agents</div><div class="stat-val" id="stAg">–</div></div>
  </div>
  <div class="card">
    <div class="card-head"><div class="card-title">Services</div></div>
    <div id="stSvc" style="color:var(--tx2);font-size:13px">Lade…</div>
  </div>
</div>
<script>
(function(){
  if(typeof api!=='function') return;
  api('/api/organisator/health').then(function(d){
    var set=function(id,html){var e=document.getElementById(id); if(e) e.innerHTML=html;};
    if(d){
      var ok=function(b){return '<span class="status-dot" style="background:var('+(b?'--green':'--red')+')"></span> '+(b?'OK':'DOWN')};
      set('stApi',ok(d.api!==false));
      set('stDb',ok(d.db!==false));
      set('stAg',(d.agents_online||0)+' online');
      var svc=document.getElementById('stSvc');
      if(svc&&d.services){ svc.innerHTML=Object.keys(d.services).map(function(k){return '<div style="padding:6px 0;border-bottom:1px solid var(--brd);display:flex;justify-content:space-between"><span>'+k+'</span>'+ok(d.services[k])+'</div>'}).join(''); }
    }
  }).catch(function(){});
})();
</script>
