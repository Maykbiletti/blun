<div class="page-frag" data-page-slug="agent-profile">
  <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px">
    <div style="width:64px;height:64px;border-radius:50%;background:var(--bg3);border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--tx)">A</div>
    <div>
      <div style="font-size:22px;font-weight:700;color:var(--tx)" id="apName">Agent Profil</div>
      <div style="color:var(--tx2);font-size:13px" id="apRole">Wird geladen…</div>
    </div>
  </div>
  <div class="stats-row" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px">
    <div class="stat-card"><div class="stat-label">Tasks gesamt</div><div class="stat-val" id="apStatTotal">–</div></div>
    <div class="stat-card"><div class="stat-label">Erledigt</div><div class="stat-val" id="apStatDone">–</div></div>
    <div class="stat-card"><div class="stat-label">Offen</div><div class="stat-val" id="apStatOpen">–</div></div>
    <div class="stat-card"><div class="stat-label">Fehlgeschlagen</div><div class="stat-val" id="apStatFail">–</div></div>
  </div>
  <div class="card">
    <div class="card-head"><div class="card-title">Letzte Aktivitaet</div></div>
    <div id="apActivity" style="color:var(--tx2);font-size:13px">Lade…</div>
  </div>
</div>
<script>
(function(){
  var slug='agent-profile';
  if(typeof api!=='function') return;
  api('/api/organisator/agents').then(function(list){
    var a=(list||[])[0]; if(!a) return;
    var n=document.getElementById('apName'); if(n) n.textContent=a.name||'Agent';
    var r=document.getElementById('apRole'); if(r) r.textContent=a.role||'';
    api('/api/organisator/agents/'+a.id+'/tasks').then(function(t){
      var arr=t||[];
      var done=arr.filter(function(x){return x.status==='completed'}).length;
      var open=arr.filter(function(x){return x.status==='pending'||x.status==='processing'||x.status==='in_progress'}).length;
      var fail=arr.filter(function(x){return x.status==='failed'}).length;
      var set=function(id,v){var e=document.getElementById(id); if(e) e.textContent=v;};
      set('apStatTotal',arr.length); set('apStatDone',done); set('apStatOpen',open); set('apStatFail',fail);
      var act=document.getElementById('apActivity');
      if(act) act.innerHTML=arr.slice(0,10).map(function(x){return '<div style="padding:6px 0;border-bottom:1px solid var(--brd)">#'+x.id+' <span class="tag">'+x.status+'</span> '+(x.task||'').slice(0,80)+'</div>'}).join('') || '<div>Keine Tasks</div>';
    }).catch(function(){});
  }).catch(function(){});
})();
</script>
