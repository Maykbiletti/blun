<div class="page-frag" data-page-slug="quality">
  <div style="font-size:20px;font-weight:700;color:var(--tx);margin-bottom:16px">Code Qualitaet</div>
  <div class="stats-row" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px">
    <div class="stat-card"><div class="stat-label">Score</div><div class="stat-val" id="qScore">–</div></div>
    <div class="stat-card"><div class="stat-label">Issues</div><div class="stat-val" id="qIssues">–</div></div>
    <div class="stat-card"><div class="stat-label">Geprueft</div><div class="stat-val" id="qChecked">–</div></div>
    <div class="stat-card"><div class="stat-label">Letzter Run</div><div class="stat-val" id="qLast" style="font-size:14px">–</div></div>
  </div>
  <div class="card">
    <div class="card-head">
      <div class="card-title">Letzte Reviews</div>
      <button class="btn btn-sm btn-primary" onclick="alert('Review wird gestartet')">Run starten</button>
    </div>
    <div id="qList" style="color:var(--tx2);font-size:13px">Keine Reviews bisher.</div>
  </div>
</div>
<script>
(function(){
  if(typeof api!=='function') return;
  api('/api/organisator/quality').then(function(d){
    var set=function(id,v){var e=document.getElementById(id); if(e) e.textContent=v;};
    if(d){ set('qScore',d.score||'–'); set('qIssues',d.issues||0); set('qChecked',d.checked||0); set('qLast',d.last_run||'–'); }
  }).catch(function(){});
})();
</script>
