<div class="page-frag" data-page-slug="pixeloffice">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <div style="font-size:20px;font-weight:700;color:var(--tx)">Pixel Office</div>
    <span class="badge badge-blue" style="font-size:11px">15 Agents</span>
  </div>

  <div class="card" style="padding:16px;overflow:hidden;position:relative">
    <svg id="pxOffice" width="800" height="500" viewBox="0 0 800 500" style="display:block;max-width:100%;height:auto;border-radius:6px">
      <defs>
        <pattern id="pxGrid" width="16" height="16" patternUnits="userSpaceOnUse">
          <rect width="16" height="16" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.4"/>
        </pattern>
      </defs>
      <!-- Background -->
      <rect width="800" height="500" rx="6" fill="#111827"/>
      <rect width="800" height="500" rx="6" fill="url(#pxGrid)"/>

      <!-- Floor -->
      <rect x="16" y="16" width="768" height="468" rx="4" fill="#1a2332" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

      <!-- Desk rows: 3 columns x 3 rows -->
      <rect x="50"  y="96"  width="160" height="6" rx="2" fill="#2a3650" opacity="0.7"/>
      <rect x="50"  y="226" width="160" height="6" rx="2" fill="#2a3650" opacity="0.7"/>
      <rect x="50"  y="356" width="160" height="6" rx="2" fill="#2a3650" opacity="0.7"/>
      <rect x="300" y="96"  width="160" height="6" rx="2" fill="#2a3650" opacity="0.7"/>
      <rect x="300" y="226" width="160" height="6" rx="2" fill="#2a3650" opacity="0.7"/>
      <rect x="300" y="356" width="160" height="6" rx="2" fill="#2a3650" opacity="0.7"/>
      <rect x="560" y="96"  width="160" height="6" rx="2" fill="#2a3650" opacity="0.7"/>
      <rect x="560" y="226" width="160" height="6" rx="2" fill="#2a3650" opacity="0.7"/>
      <rect x="560" y="356" width="160" height="6" rx="2" fill="#2a3650" opacity="0.7"/>

      <!-- Decoration: coffee machine -->
      <rect x="730" y="448" width="14" height="18" rx="2" fill="#4a3520"/>
      <rect x="732" y="450" width="3" height="7" rx="1" fill="#8b6914"/>
      <text x="737" y="472" text-anchor="middle" font-size="6" fill="rgba(255,255,255,0.2)" font-family="monospace">Kaffee</text>

      <!-- Decoration: plant -->
      <rect x="30" y="454" width="8" height="12" rx="1" fill="#1e4a1e"/>
      <rect x="32" y="448" width="4" height="8" rx="1" fill="#2d7a2d"/>

      <!-- Decoration: whiteboard -->
      <rect x="350" y="420" width="100" height="50" rx="3" fill="#1e2a3a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="400" y="448" text-anchor="middle" font-size="7" fill="rgba(255,255,255,0.15)" font-family="monospace">SPRINT BOARD</text>
    </svg>

    <!-- Tooltip -->
    <div id="pxTip" style="position:absolute;background:var(--bg2,#1a2332);border:1.5px solid var(--accent,#4a8aff);border-radius:6px;padding:8px 12px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:100;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.5)">
      <div id="pxTipName" style="font-weight:700;color:var(--accent,#4a8aff);font-size:13px"></div>
      <div id="pxTipRole" style="color:var(--tx2,#888);font-size:11px;margin-top:2px"></div>
      <div id="pxTipStatus" style="margin-top:4px;font-size:11px;color:var(--tx,#ccc)"></div>
    </div>
  </div>

  <div style="margin-top:12px;display:flex;gap:16px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx2)">
      <span style="width:7px;height:7px;border-radius:50%;background:#4caf50;display:inline-block;box-shadow:0 0 4px #4caf50"></span> Aktiv
    </div>
    <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx2)">
      <span style="width:7px;height:7px;border-radius:50%;background:#ff9800;display:inline-block;box-shadow:0 0 4px #ff9800"></span> Pause
    </div>
    <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx2)">
      <span style="width:7px;height:7px;border-radius:50%;background:#f44336;display:inline-block;box-shadow:0 0 4px #f44336"></span> Offline
    </div>
  </div>

  <style>
    .px-sprite { cursor: pointer; }
    .px-sprite:hover rect:first-child { filter: brightness(1.3); }
    @media(max-width:600px){
      #pxOffice { min-height: 300px; }
    }
  </style>
</div>

<script>
(function(){
  var agents = [
    { name:'Helmut',   role:'QA Lead',              status:'active',  color:'#e74c3c' },
    { name:'Sandra',   role:'Frontend Dev',          status:'active',  color:'#e91e63' },
    { name:'Werner',   role:'Backend Dev',           status:'active',  color:'#9c27b0' },
    { name:'Klaus',    role:'DevOps',                status:'idle',    color:'#673ab7' },
    { name:'Fritz',    role:'Security Engineer',     status:'active',  color:'#3f51b5' },
    { name:'Petra',    role:'UI/UX Designer',        status:'active',  color:'#2196f3' },
    { name:'Hanno',    role:'Data Engineer',         status:'offline', color:'#00bcd4' },
    { name:'Greta',    role:'ML Engineer',           status:'active',  color:'#009688' },
    { name:'Rolf',     role:'Business Dev',          status:'active',  color:'#4caf50' },
    { name:'Brigitte', role:'Product Manager',       status:'idle',    color:'#8bc34a' },
    { name:'Heinrich', role:'Architect',             status:'active',  color:'#cddc39' },
    { name:'Marlene',  role:'QA Engineer',           status:'active',  color:'#ffeb3b' },
    { name:'Leon',     role:'Infrastructure',        status:'offline', color:'#ff9800' },
    { name:'Dieter',   role:'Daemon Operator',       status:'active',  color:'#ff5722' },
    { name:'Sabine',   role:'Technical Writer',      status:'idle',    color:'#795548' }
  ];

  var statusLabels = { active:'Aktiv', idle:'Pause', offline:'Offline' };
  var statusColors = { active:'#4caf50', idle:'#ff9800', offline:'#f44336' };

  // 15 positions spread across 3x3 desk grid (5 per column area, staggered)
  var positions = [
    { x:70,  y:60  }, { x:140, y:60  },
    { x:70,  y:190 }, { x:140, y:190 },
    { x:70,  y:320 },
    { x:320, y:60  }, { x:390, y:60  },
    { x:320, y:190 }, { x:390, y:190 },
    { x:320, y:320 },
    { x:580, y:60  }, { x:650, y:60  },
    { x:580, y:190 }, { x:650, y:190 },
    { x:580, y:320 }
  ];

  // Deterministic shuffle
  function shuffle(arr){
    var a = arr.slice();
    var s = 42;
    for(var i = a.length-1; i > 0; i--){
      s = (s * 16807 + 7) % 2147483647;
      var j = s % (i+1);
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  var spots = shuffle(positions);
  var svg = document.getElementById('pxOffice');
  var tip = document.getElementById('pxTip');
  var tipName = document.getElementById('pxTipName');
  var tipRole = document.getElementById('pxTipRole');
  var tipStatus = document.getElementById('pxTipStatus');

  if(!svg) return;

  function darken(hex, amt){
    var n = parseInt(hex.slice(1),16);
    var r = Math.max(0,(n>>16)-amt);
    var g = Math.max(0,((n>>8)&0xff)-amt);
    var b = Math.max(0,(n&0xff)-amt);
    return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
  }

  function ns(tag){
    return document.createElementNS('http://www.w3.org/2000/svg', tag);
  }

  function px(parent, x, y, w, h, fill){
    var r = ns('rect');
    r.setAttribute('x', x);
    r.setAttribute('y', y);
    r.setAttribute('width', w);
    r.setAttribute('height', h);
    r.setAttribute('fill', fill);
    parent.appendChild(r);
    return r;
  }

  function buildSprite(agent, pos, idx){
    var g = ns('g');
    g.setAttribute('class', 'px-sprite');

    var bx = pos.x;
    var by = pos.y;
    var mc = agent.color;
    var dc = darken(mc, 45);
    var skin = '#ffcc99';
    var eye = '#1a1a2e';

    // Head
    px(g, bx+4, by+0, 8, 6, skin);
    // Hair
    px(g, bx+4, by+0, 8, 2, dc);
    // Left eye
    px(g, bx+5, by+3, 2, 2, eye);
    // Right eye
    px(g, bx+9, by+3, 2, 2, eye);
    // Mouth
    px(g, bx+7, by+5, 2, 1, darken(skin, 40));
    // Body
    px(g, bx+3, by+6, 10, 7, mc);
    // Belt/detail
    px(g, bx+3, by+11, 10, 1, dc);
    // Left arm
    px(g, bx+1, by+6, 2, 6, mc);
    // Right arm
    px(g, bx+13, by+6, 2, 6, mc);
    // Left leg
    px(g, bx+4, by+13, 3, 3, dc);
    // Right leg
    px(g, bx+9, by+13, 3, 3, dc);
    // Left shoe
    px(g, bx+3, by+15, 4, 1, '#333');
    // Right shoe
    px(g, bx+9, by+15, 4, 1, '#333');

    // Status dot
    var dot = ns('circle');
    dot.setAttribute('cx', bx+15);
    dot.setAttribute('cy', by+1);
    dot.setAttribute('r', '2.5');
    dot.setAttribute('fill', statusColors[agent.status]);
    g.appendChild(dot);

    // Glow on status dot
    if(agent.status === 'active'){
      var glow = ns('circle');
      glow.setAttribute('cx', bx+15);
      glow.setAttribute('cy', by+1);
      glow.setAttribute('r', '4');
      glow.setAttribute('fill', 'none');
      glow.setAttribute('stroke', statusColors[agent.status]);
      glow.setAttribute('stroke-width', '0.5');
      glow.setAttribute('opacity', '0.4');
      var anim = ns('animate');
      anim.setAttribute('attributeName', 'r');
      anim.setAttribute('values', '3;5;3');
      anim.setAttribute('dur', '2s');
      anim.setAttribute('repeatCount', 'indefinite');
      glow.appendChild(anim);
      g.appendChild(glow);
    }

    // Name label
    var label = ns('text');
    label.setAttribute('x', bx+8);
    label.setAttribute('y', by+26);
    label.setAttribute('text-anchor', 'middle');
    label.setAttribute('font-size', '7');
    label.setAttribute('fill', 'rgba(255,255,255,0.35)');
    label.setAttribute('font-family', "'Courier New',monospace");
    label.textContent = agent.name;
    g.appendChild(label);

    // Bobbing animation
    var bob = ns('animateTransform');
    bob.setAttribute('attributeName', 'transform');
    bob.setAttribute('type', 'translate');
    bob.setAttribute('values', '0,0; 0,-1.5; 0,0; 0,0.8; 0,0');
    bob.setAttribute('dur', (1.6 + idx * 0.12) + 's');
    bob.setAttribute('begin', (idx * 0.3) + 's');
    bob.setAttribute('repeatCount', 'indefinite');
    g.appendChild(bob);

    // Hover hitbox
    var hb = ns('rect');
    hb.setAttribute('x', bx-2);
    hb.setAttribute('y', by-4);
    hb.setAttribute('width', 20);
    hb.setAttribute('height', 34);
    hb.setAttribute('fill', 'transparent');
    hb.style.cursor = 'pointer';
    g.appendChild(hb);

    // Events
    g.addEventListener('mouseenter', function(e){
      tipName.textContent = agent.name;
      tipRole.textContent = agent.role;
      var sc = statusColors[agent.status];
      tipStatus.innerHTML = '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+sc+';margin-right:5px;vertical-align:middle;box-shadow:0 0 4px '+sc+'"></span>'+statusLabels[agent.status];
      tip.style.opacity = '1';
    });

    g.addEventListener('mousemove', function(e){
      var card = svg.closest('.card');
      if(!card) return;
      var cr = card.getBoundingClientRect();
      tip.style.left = (e.clientX - cr.left + 14) + 'px';
      tip.style.top = (e.clientY - cr.top - 10) + 'px';
    });

    g.addEventListener('mouseleave', function(){
      tip.style.opacity = '0';
    });

    return g;
  }

  // Render
  for(var i = 0; i < agents.length; i++){
    svg.appendChild(buildSprite(agents[i], spots[i], i));
  }

})();
</script>
