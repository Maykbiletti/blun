<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLUN -- Billing</title>
<script src="https://js.stripe.com/v3/"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e5e5e5;font-family:'Inter',system-ui,-apple-system,sans-serif;min-height:100vh}
a{color:#3b82f6;text-decoration:none}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid #1a1a1a}
.topbar h1{font-size:1.25rem;font-weight:700;color:#fff}
.topbar a{font-size:.875rem;color:#a3a3a3}.topbar a:hover{color:#fff}
.container{max-width:1100px;margin:0 auto;padding:2rem}
h2{font-size:1.5rem;font-weight:700;color:#fff;margin-bottom:.5rem}
.subtitle{color:#737373;margin-bottom:2rem;font-size:.875rem}
.current-plan{background:#1a1a1a;border:1px solid #27272a;border-radius:12px;padding:1.5rem;margin-bottom:2rem;display:flex;align-items:center;justify-content:space-between}
.current-plan .plan-name{font-size:1.125rem;font-weight:600;color:#3b82f6}
.current-plan .plan-info{color:#a3a3a3;font-size:.8rem;margin-top:.25rem}
.badge{display:inline-block;padding:.25rem .75rem;border-radius:20px;font-size:.75rem;font-weight:600;background:#1e3a5f;color:#3b82f6}
.plans-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2.5rem}
@media(max-width:900px){.plans-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:540px){.plans-grid{grid-template-columns:1fr}}
.plan-card{background:#1a1a1a;border:1px solid #27272a;border-radius:12px;padding:1.5rem;transition:border-color .2s;cursor:pointer;display:flex;flex-direction:column}
.plan-card:hover{border-color:#404040}
.plan-card.active{border-color:#3b82f6}
.plan-card.selected{border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,0.3)}
.plan-card.featured{border-color:#3b82f6;box-shadow:0 0 20px rgba(59,130,246,0.15)}
.plan-card.featured .recommended{display:block}
.recommended{display:none;font-size:.7rem;font-weight:600;color:#3b82f6;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.plan-card h3{font-size:1rem;font-weight:600;color:#fff;margin-bottom:.25rem}
.plan-card .price{font-size:1.75rem;font-weight:700;color:#fff;margin:.75rem 0}
.plan-card .price span{font-size:.875rem;font-weight:400;color:#737373}
.plan-card ul{list-style:none;margin:.75rem 0 1rem;flex:1}
.plan-card li{font-size:.8rem;color:#a3a3a3;padding:.25rem 0;padding-left:1.25rem;position:relative}
.plan-card li::before{content:'\2713';position:absolute;left:0;color:#3b82f6;font-size:.75rem}
.plan-card li.no::before{content:'\2717';color:#525252}
.plan-card li.no{color:#525252}
.btn{display:inline-block;padding:.625rem 1.25rem;text-align:center;border-radius:8px;font-size:.8rem;font-weight:600;border:none;cursor:pointer;transition:all .2s}
.btn-primary{background:#3b82f6;color:#fff}.btn-primary:hover{background:#2563eb}
.btn-outline{background:transparent;border:1px solid #404040;color:#a3a3a3}.btn-outline:hover{border-color:#737373;color:#fff}
.btn-current{background:#27272a;color:#737373;cursor:default}
.btn-danger{background:transparent;border:1px solid #7f1d1d;color:#ef4444}.btn-danger:hover{background:#7f1d1d;color:#fff}
.btn-contact{background:#1e3a5f;color:#3b82f6}.btn-contact:hover{background:#1e40af;color:#fff}
.btn-full{width:100%}
.section-title{font-size:1.125rem;font-weight:600;color:#fff;margin-bottom:1rem}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.75rem;color:#737373;font-weight:500;padding:.75rem;border-bottom:1px solid #27272a}
td{padding:.75rem;font-size:.8rem;color:#a3a3a3;border-bottom:1px solid #1a1a1a}
.status-paid{color:#22c55e}.status-pending{color:#3b82f6}.status-failed{color:#ef4444}
.empty{text-align:center;padding:2rem;color:#525252;font-size:.875rem}
.usage-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:2rem}
.usage-card{background:#1a1a1a;border:1px solid #27272a;border-radius:8px;padding:1rem}
.usage-card .label{font-size:.75rem;color:#737373;margin-bottom:.25rem}
.usage-card .value{font-size:1.25rem;font-weight:600;color:#fff}
.usage-card .limit{font-size:.75rem;color:#525252}
#loading{text-align:center;padding:3rem;color:#525252}
#paymentSection{display:none;background:#1a1a1a;border:1px solid #27272a;border-radius:12px;padding:1.5rem;margin-bottom:2rem}
#paymentSection .pe-title{font-size:1rem;font-weight:600;color:#fff;margin-bottom:1rem}
#payment-element{min-height:80px}
#payment-message{margin-top:1rem;font-size:.85rem;padding:.75rem;border-radius:8px;display:none}
#payment-message.error{display:block;background:#1c0a0a;border:1px solid #7f1d1d;color:#ef4444}
#payment-message.success{display:block;background:#052e16;border:1px solid #166534;color:#22c55e}
#submit-payment{margin-top:1rem;width:100%;padding:.75rem;font-size:.9rem}
#submit-payment:disabled{opacity:.5;cursor:not-allowed}
.manage-row{display:flex;gap:1rem;margin-top:1.5rem;flex-wrap:wrap}
</style>
</head>
<body>
<div class="topbar">
  <h1>BLUN</h1>
  <div><a href="/dashboard">&larr; Dashboard</a></div>
</div>
<div class="container">
  <h2>Billing &amp; Plans</h2>
  <p class="subtitle">Manage your subscription, view invoices, and compare plans.</p>
  <div id="loading">Loading...</div>
  <div id="content" style="display:none">
    <div class="current-plan" id="currentPlan"></div>
    <div class="section-title">Usage</div>
    <div class="usage-grid" id="usageGrid"></div>
    <div class="section-title">Plans</div>
    <div class="plans-grid" id="plansGrid"></div>

    <div id="paymentSection">
      <div class="pe-title" id="pe-title">Complete Payment</div>
      <div id="payment-element"></div>
      <div id="payment-message"></div>
      <button id="submit-payment" class="btn btn-primary" onclick="submitPayment()">Subscribe</button>
      <button class="btn btn-outline" style="width:100%;margin-top:.5rem" onclick="cancelPayment()">Cancel</button>
    </div>

    <div class="manage-row">
      <button class="btn btn-outline" onclick="openPortal()">Manage via Stripe Portal</button>
      <button class="btn btn-danger" id="cancelBtn" style="display:none" onclick="cancelSubscription()">Cancel Subscription</button>
    </div>

    <div style="margin-top:2.5rem">
      <div class="section-title">Invoice History</div>
      <table>
        <thead><tr><th>Date</th><th>Amount</th><th>Status</th><th>PDF</th></tr></thead>
        <tbody id="invoiceBody"></tbody>
      </table>
      <div id="noInvoices" class="empty" style="display:none">No invoices yet.</div>
    </div>
  </div>
</div>
<script>
var currentPlan = "free";
var stripeInstance = null;
var elements = null;
var paymentElement = null;
var selectedPlan = null;

var PLANS = [
  {
    id: "free",
    name: "Free",
    price: "$0",
    period: "",
    features: [
      { text: "3 assistants", ok: true },
      { text: "2 local AI models", ok: true },
      { text: "100 messages per day", ok: true },
      { text: "1 project", ok: true },
      { text: "Cloud AI models", ok: false },
      { text: "Collaboration", ok: false },
      { text: "Priority support", ok: false }
    ]
  },
  {
    id: "pro",
    name: "Pro",
    price: "$20",
    period: "/mo",
    featured: true,
    features: [
      { text: "20 assistants", ok: true },
      { text: "All local AI models", ok: true },
      { text: "3 cloud AI models", ok: true },
      { text: "Unlimited messages", ok: true },
      { text: "10 projects", ok: true },
      { text: "Collaboration", ok: true },
      { text: "Priority support", ok: false }
    ]
  },
  {
    id: "max",
    name: "Max",
    price: "$100",
    period: "/mo",
    features: [
      { text: "Unlimited assistants", ok: true },
      { text: "All local AI models", ok: true },
      { text: "10 cloud AI models", ok: true },
      { text: "Unlimited messages", ok: true },
      { text: "Unlimited projects", ok: true },
      { text: "Collaboration", ok: true },
      { text: "Priority support", ok: true }
    ]
  },
  {
    id: "enterprise",
    name: "Enterprise",
    price: "Custom",
    period: "",
    features: [
      { text: "Everything in Max", ok: true },
      { text: "Custom integrations", ok: true },
      { text: "Dedicated support", ok: true },
      { text: "SLA guarantee", ok: true },
      { text: "On-premise option", ok: true },
      { text: "Custom AI models", ok: true },
      { text: "Volume pricing", ok: true }
    ]
  }
];

function apiFetch(u, o) {
  return fetch(u, Object.assign({ credentials: "include", headers: { "Content-Type": "application/json" } }, o || {})).then(function(r) { return r.json(); });
}

async function initStripe() {
  var cfg = await apiFetch("/billing/api/config");
  stripeInstance = Stripe(cfg.publicKey);
}

function renderPlans() {
  var pg = document.getElementById("plansGrid");
  pg.innerHTML = PLANS.map(function(p) {
    var ic = p.id === currentPlan;
    var isFeatured = p.featured ? " featured" : "";
    var isPayable = p.id !== "free" && p.id !== "enterprise" && !ic;
    var bc, bt, oc;

    if (ic) {
      bc = "btn btn-current btn-full";
      bt = "Current Plan";
      oc = "";
    } else if (p.id === "enterprise") {
      bc = "btn btn-contact btn-full";
      bt = "Contact Us";
      oc = "";
    } else if (p.id === "free" && currentPlan !== "free") {
      bc = "btn btn-outline btn-full";
      bt = "Downgrade";
      oc = " onclick=\"cancelSubscription()\"";
    } else if (isPayable) {
      bc = "btn btn-primary btn-full";
      bt = currentPlan !== "free" ? "Switch to " + p.name : "Upgrade to " + p.name;
      oc = " onclick=\"selectPlan('" + p.id + "')\"";
    } else {
      bc = "btn btn-primary btn-full";
      bt = "Upgrade to " + p.name;
      oc = " onclick=\"selectPlan('" + p.id + "')\"";
    }

    var recHtml = p.featured ? '<div class="recommended">Recommended</div>' : '';
    var priceHtml = p.period ? p.price + '<span>' + p.period + '</span>' : p.price;

    return '<div class="plan-card' + (ic ? " active" : "") + isFeatured + '" id="plan-' + p.id + '">' +
      recHtml +
      '<h3>' + p.name + '</h3>' +
      '<div class="price">' + priceHtml + '</div>' +
      '<ul>' + p.features.map(function(f) {
        return '<li class="' + (f.ok ? "" : "no") + '">' + f.text + '</li>';
      }).join("") + '</ul>' +
      '<button class="' + bc + '"' + oc + '>' + bt + '</button>' +
      '</div>';
  }).join("");
}

async function load() {
  await initStripe();
  var d = await Promise.all([apiFetch("/billing/subscription"), apiFetch("/billing/invoices")]);
  var subData = d[0], invData = d[1];
  currentPlan = (subData.subscription && subData.subscription.plan) || "free";
  var subStatus = (subData.subscription && subData.subscription.status) || "active";
  var det = subData.plan_details || {};

  var cp = document.getElementById("currentPlan");
  var end = subData.subscription && subData.subscription.current_period_end ? new Date(subData.subscription.current_period_end).toLocaleDateString() : "";
  var statusText = subStatus === "cancelling" ? " (cancels at period end)" : "";

  var planObj = PLANS.find(function(p) { return p.id === currentPlan; });
  var planLabel = planObj ? planObj.name : "Free";

  cp.innerHTML = '<div><div class="plan-name">' + planLabel + ' Plan</div><div class="plan-info">' + (end ? "Renews " + end + statusText : "No active subscription") + '</div></div><span class="badge">' + currentPlan.toUpperCase() + '</span>';

  if (currentPlan !== "free" && subStatus !== "cancelled" && subStatus !== "cancelling") {
    document.getElementById("cancelBtn").style.display = "";
  } else {
    document.getElementById("cancelBtn").style.display = "none";
  }

  var limits = det.limits || {};
  var ug = document.getElementById("usageGrid");
  ug.innerHTML = [
    { l: "Assistants", k: "agents" },
    { l: "Projects", k: "projects" },
    { l: "Messages / Day", k: "messages_per_day" },
    { l: "Cloud AI Models", k: "cloud_ais" }
  ].map(function(u) {
    var lim = limits[u.k];
    var lt = lim === -1 ? "Unlimited" : (lim !== undefined ? lim : "--");
    return '<div class="usage-card"><div class="label">' + u.l + '</div><div class="value">&mdash;</div><div class="limit">Limit: ' + lt + '</div></div>';
  }).join("");

  renderPlans();

  var invs = invData.invoices || [];
  var ib = document.getElementById("invoiceBody");
  var ni = document.getElementById("noInvoices");
  if (!invs.length) { ni.style.display = ""; } else {
    ni.style.display = "none";
    ib.innerHTML = invs.map(function(i) {
      var dt = new Date(i.created_at).toLocaleDateString();
      var am = "$" + ((i.amount_cents || 0) / 100).toFixed(2);
      var sc = i.status === "paid" ? "status-paid" : (i.status === "failed" ? "status-failed" : "status-pending");
      var pdf = i.pdf_url ? '<a href="' + i.pdf_url + '" target="_blank">Download</a>' : "&mdash;";
      return "<tr><td>" + dt + "</td><td>" + am + "</td><td class=\"" + sc + "\">" + i.status + "</td><td>" + pdf + "</td></tr>";
    }).join("");
  }

  document.getElementById("loading").style.display = "none";
  document.getElementById("content").style.display = "";
}

async function selectPlan(plan) {
  selectedPlan = plan;
  document.querySelectorAll(".plan-card").forEach(function(c) { c.classList.remove("selected"); });
  var card = document.getElementById("plan-" + plan);
  if (card) card.classList.add("selected");

  var msg = document.getElementById("payment-message");
  msg.style.display = "none";
  msg.className = "";

  var planObj = PLANS.find(function(p) { return p.id === plan; });
  var planLabel = planObj ? planObj.name : plan;
  document.getElementById("pe-title").textContent = "Subscribe to " + planLabel;
  document.getElementById("submit-payment").textContent = "Subscribe to " + planLabel;
  document.getElementById("submit-payment").disabled = true;
  document.getElementById("paymentSection").style.display = "";

  try {
    var data = await apiFetch("/billing/api/create-subscription", {
      method: "POST",
      body: JSON.stringify({ plan: plan })
    });

    if (data.error) {
      showMessage(data.error, "error");
      return;
    }

    if (!data.clientSecret) {
      showMessage("Plan updated successfully!", "success");
      setTimeout(function() { document.getElementById("paymentSection").style.display = "none"; load(); }, 1500);
      return;
    }

    var appearance = {
      theme: 'night',
      variables: {
        colorPrimary: '#3b82f6',
        colorBackground: '#1a1a1a',
        colorText: '#e5e5e5',
        colorDanger: '#ef4444',
        fontFamily: 'Inter, system-ui, -apple-system, sans-serif',
        borderRadius: '8px',
        spacingUnit: '4px'
      },
      rules: {
        '.Input': { border: '1px solid #404040', backgroundColor: '#0a0a0a' },
        '.Input:focus': { border: '1px solid #3b82f6', boxShadow: '0 0 0 1px #3b82f6' },
        '.Label': { color: '#a3a3a3' },
        '.Tab': { border: '1px solid #404040', backgroundColor: '#1a1a1a' },
        '.Tab--selected': { border: '1px solid #3b82f6', backgroundColor: '#1a1a1a' },
        '.Tab:hover': { border: '1px solid #525252' }
      }
    };

    elements = stripeInstance.elements({ clientSecret: data.clientSecret, appearance: appearance });
    document.getElementById("payment-element").innerHTML = "";
    paymentElement = elements.create("payment", { layout: { type: 'tabs', defaultCollapsed: false } });
    paymentElement.mount("#payment-element");
    paymentElement.on("ready", function() { document.getElementById("submit-payment").disabled = false; });
  } catch (err) {
    showMessage("Error: " + err.message, "error");
  }
}

async function submitPayment() {
  var btn = document.getElementById("submit-payment");
  btn.disabled = true;
  btn.textContent = "Processing...";
  document.getElementById("payment-message").style.display = "none";

  try {
    var result = await stripeInstance.confirmPayment({
      elements: elements,
      confirmParams: { return_url: window.location.origin + "/billing" },
      redirect: "if_required"
    });

    if (result.error) {
      showMessage(result.error.message, "error");
      btn.disabled = false;
      btn.textContent = "Subscribe";
    } else {
      showMessage("Payment successful! Your plan is now active.", "success");
      btn.textContent = "Done";
      setTimeout(function() { document.getElementById("paymentSection").style.display = "none"; load(); }, 2000);
    }
  } catch (err) {
    showMessage("Payment error: " + err.message, "error");
    btn.disabled = false;
    btn.textContent = "Subscribe";
  }
}

function cancelPayment() {
  document.getElementById("paymentSection").style.display = "none";
  document.querySelectorAll(".plan-card").forEach(function(c) { c.classList.remove("selected"); });
  selectedPlan = null;
}

function showMessage(text, type) {
  var msg = document.getElementById("payment-message");
  msg.textContent = text;
  msg.className = type;
  msg.style.display = "block";
}

async function cancelSubscription() {
  if (!confirm("Cancel your subscription? You will retain access until the end of the current billing period.")) return;
  try {
    var data = await apiFetch("/billing/api/cancel", { method: "POST" });
    if (data.error) { alert(data.error); } else { load(); }
  } catch (err) { alert("Error: " + err.message); }
}

async function openPortal() {
  var d = await apiFetch("/billing/portal", { method: "POST" });
  if (d.url) window.location.href = d.url;
  else alert(d.error || "No subscription to manage");
}

(function() {
  var params = new URLSearchParams(window.location.search);
  if (params.get("payment_intent_client_secret")) {
    initStripe().then(function() {
      return stripeInstance.retrievePaymentIntent(params.get("payment_intent_client_secret"));
    }).then(function(result) {
      if (result.paymentIntent && result.paymentIntent.status === "succeeded") {
        showMessage("Payment successful! Your plan is now active.", "success");
        document.getElementById("paymentSection").style.display = "";
      }
      window.history.replaceState({}, "", "/billing");
    });
  }
})();

load();
</script>
</body>
</html>
