<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>KI-Organisator - BLUN</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--card:#1a1a1a;--border:#262626;--fg:#fafafa;--fg2:#a1a1aa;--fg3:#52525b;--blue:#3b82f6;--blue-dim:#1d4ed8;--green:#22c55e;--red:#ef4444;--orange:#f59e0b;--radius:8px;--font:'Inter',-apple-system,sans-serif}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
button{font-family:var(--font);cursor:pointer;border:none;border-radius:var(--radius);font-size:13px;font-weight:500;padding:8px 16px;transition:all .15s}
input,textarea,select{font-family:var(--font);background:#141414;border:1px solid var(--border);border-radius:var(--radius);color:var(--fg);padding:8px 12px;font-size:13px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
textarea{resize:vertical;min-height:80px}

.shell{display:flex;flex-direction:column;height:100vh;max-width:1400px;margin:0 auto;padding:20px}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.header h1{font-size:20px;font-weight:700}
.header h1 span{color:var(--blue)}
.header-actions{display:flex;gap:8px}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-dim)}
.btn-ghost{background:transparent;color:var(--fg2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--card);color:var(--fg)}
.btn-danger{background:transparent;color:var(--red);border:1px solid #7f1d1d}
.btn-danger:hover{background:#7f1d1d}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-green{background:#166534;color:var(--green)}
.btn-green:hover{background:#15803d}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.stat-card .label{font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.stat-card .value{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-card .value.blue{color:var(--blue)}
.stat-card .value.green{color:var(--green)}
.stat-card .value.orange{color:var(--orange)}

/* Main layout */
.main{display:flex;gap:16px;flex:1;min-height:0}
.agent-list{width:340px;flex-shrink:0;overflow-y:auto}
.agent-detail{flex:1;display:flex;flex-direction:column;min-height:0}

/* Agent cards */
.agent-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.agent-card:hover,.agent-card.active{border-color:var(--blue)}
.agent-card .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.agent-card .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.active{background:var(--green)}
.dot.idle{background:var(--fg3)}
.dot.working{background:var(--orange);animation:pulse 1s infinite}
.dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.agent-card .name{font-weight:600;font-size:14px;flex:1}
.agent-card .role{font-size:11px;color:var(--fg3)}
.agent-card .meta{display:flex;gap:12px;font-size:11px;color:var(--fg2)}
.agent-card .meta span{display:flex;align-items:center;gap:4px}

/* Detail panel */
.detail-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);flex:1;display:flex;flex-direction:column;min-height:0}
.detail-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.detail-header .info h2{font-size:16px;font-weight:600}
.detail-header .info p{font-size:12px;color:var(--fg2)}
.detail-header .actions{display:flex;gap:6px}

.detail-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 16px}
.detail-tabs button{background:none;color:var(--fg3);padding:10px 16px;font-size:12px;font-weight:500;border-bottom:2px solid transparent;border-radius:0;margin-bottom:-1px}
.detail-tabs button.active{color:var(--blue);border-bottom-color:var(--blue)}
.detail-tabs button:hover{color:var(--fg)}

.tab-content{flex:1;overflow-y:auto;padding:16px}

/* Chat */
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.chat-msg{max-width:80%;padding:10px 14px;border-radius:var(--radius);font-size:13px;line-height:1.5;white-space:pre-wrap}
.chat-msg.user{background:var(--blue);color:#fff;align-self:flex-end}
.chat-msg.assistant{background:#141414;border:1px solid var(--border);align-self:flex-start}
.chat-input{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
.chat-input input{flex:1}

/* Tables */
.task-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.task-row:last-child{border-bottom:none}
.task-status{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.task-status.completed{background:#166534;color:var(--green)}
.task-status.pending{background:#1e293b;color:var(--blue)}
.task-status.processing{background:#78350f;color:var(--orange)}
.task-status.error{background:#7f1d1d;color:var(--red)}
.task-row .task-text{flex:1;color:var(--fg2)}
.task-row .task-time{color:var(--fg3);font-size:11px}

.mem-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.mem-row .mem-key{font-weight:600;min-width:120px;color:var(--blue)}
.mem-row .mem-val{flex:1;color:var(--fg2)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;display:none}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:480px;max-width:90vw}
.modal h3{font-size:16px;margin-bottom:16px}
.modal .field{margin-bottom:12px}
.modal .field label{display:block;font-size:12px;color:var(--fg2);margin-bottom:4px}
.modal .field-row{display:flex;gap:8px}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

/* Empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--fg3);font-size:13px}
.empty p{margin-top:8px}

/* No selection */
.no-selection{display:flex;align-items:center;justify-content:center;height:100%;color:var(--fg3);font-size:14px}
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1><span>KI</span>-Organisator</h1>
    <div class="header-actions">
      <button class="btn-ghost btn-sm" onclick="loadAll()">Aktualisieren</button>
      <button class="btn-primary btn-sm" onclick="showCreateModal()">+ Neuer Agent</button>
    </div>
  </div>

  <div class="stats" id="stats">
    <div class="stat-card"><div class="label">Agents</div><div class="value blue" id="st-total">0</div></div>
    <div class="stat-card"><div class="label">Aktiv</div><div class="value green" id="st-active">0</div></div>
    <div class="stat-card"><div class="label">Tasks erledigt</div><div class="value" id="st-tasks">0</div></div>
    <div class="stat-card"><div class="label">Kosten (USD)</div><div class="value orange" id="st-cost">0.00</div></div>
  </div>

  <div class="main">
    <div class="agent-list" id="agent-list"></div>
    <div class="agent-detail" id="agent-detail">
      <div class="no-selection">Agent auswaehlen oder neuen erstellen</div>
    </div>
  </div>
</div>

<!-- Create/Edit Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title">Neuer Agent</h3>
    <div class="field"><label>Name</label><input id="f-name" placeholder="z.B. DevOps Agent"></div>
    <div class="field"><label>Rolle</label><input id="f-role" placeholder="z.B. Backend Developer"></div>
    <div class="field"><label>KI-Modell</label>
      <select id="f-model">
        <optgroup label="Kostenlos — Lokale Modelle" id="local-models-group">
          <option value="local:auto">Bestes lokales Modell (automatisch)</option>
          <option value="local:gemma-4-large">Gemma 4 Large 27B (12-18GB RAM)</option>
          <option value="local:deepseek-r1-8b">DeepSeek R1 8B (5GB RAM)</option>
          <option value="local:llama-3.3-70b">Llama 3.3 70B (40GB RAM)</option>
          <option value="local:mistral-7b">Mistral 7B (4GB RAM)</option>
          <option value="local:qwen-2.5-14b">Qwen 2.5 14B (8GB RAM)</option>
          <option value="local:tinyllama-1.1b">TinyLlama 1.1B (0.7GB RAM)</option>
        </optgroup>
        <optgroup label="Bezahlt — Claude (Anthropic)">
          <option value="claude-opus-4-6">Claude Opus 4.6 (staerkstes)</option>
          <option value="claude-sonnet-4-6">Claude Sonnet 4.6 (schnell + stark)</option>
          <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5 (guenstig)</option>
        </optgroup>
        <optgroup label="Bezahlt — OpenAI">
          <option value="gpt-4o">GPT-4o (stark)</option>
          <option value="gpt-4o-mini">GPT-4o-mini (guenstig)</option>
          <option value="o3-mini">o3-mini (reasoning)</option>
        </optgroup>
        <optgroup label="Bezahlt — Google">
          <option value="gemini-3.0-pro">Gemini 3.0 Pro (neuestes)</option>
          <option value="gemini-2.5-pro">Gemini 2.5 Pro (stark)</option>
          <option value="gemini-2.5-flash">Gemini 2.5 Flash (schnell)</option>
          <option value="gemini-2.0-flash">Gemini 2.0 Flash (guenstig)</option>
        </optgroup>
      </select>
      <div id="local-models-info" style="font-size:11px;color:var(--fg3);margin-top:4px"></div>
    </div>
    <div class="field"><label>System Prompt</label><textarea id="f-prompt" rows="4" placeholder="Instruktionen fuer den Agent..."></textarea></div>
    <div class="field"><label>Persoenlichkeit</label><input id="f-personality" placeholder="z.B. direkt, analytisch"></div>
    <div class="field"><label>Heartbeat (Sekunden)</label><input id="f-heartbeat" type="number" value="60" min="10" max="3600"></div>
    <input type="hidden" id="f-edit-id">
    <div class="actions">
      <button class="btn-ghost" onclick="hideModal()">Abbrechen</button>
      <button class="btn-primary" onclick="saveAgent()">Speichern</button>
    </div>
  </div>
</div>

<script>
var BASE = "/api/organisator";
var selectedAgent = null;
var agents = [];

async function api(path, opts) {
  var r = await fetch(BASE + path, Object.assign({ headers: { "Content-Type": "application/json" } }, opts));
  return r.json();
}

async function loadStats() {
  var s = await api("/stats");
  document.getElementById("st-total").textContent = s.total_agents;
  document.getElementById("st-active").textContent = s.active_agents;
  document.getElementById("st-tasks").textContent = s.tasks_completed;
  document.getElementById("st-cost").textContent = s.total_cost.toFixed(4);
}

async function loadAgents() {
  agents = await api("/agents");
  var list = document.getElementById("agent-list");
  if (agents.length === 0) {
    list.innerHTML = '<div class="empty"><p>Keine Agents vorhanden</p></div>';
    return;
  }
  list.innerHTML = agents.map(function(a) {
    var ago = a.last_heartbeat ? timeAgo(new Date(a.last_heartbeat)) : "nie";
    return '<div class="agent-card' + (selectedAgent === a.id ? ' active' : '') + '" onclick="selectAgent(\'' + a.id + '\')">' +
      '<div class="top"><div class="dot ' + a.status + '"></div><div class="name">' + esc(a.name) + '</div></div>' +
      '<div class="role">' + esc(a.role) + '</div>' +
      '<div class="meta"><span>' + esc(a.model) + '</span><span>Heartbeat: ' + ago + '</span></div>' +
    '</div>';
  }).join("");
}

function loadAll() { loadStats(); loadAgents(); }

async function selectAgent(id) {
  selectedAgent = id;
  loadAgents();
  var a = agents.find(function(x) { return x.id === id; });
  if (!a) return;
  var panel = document.getElementById("agent-detail");
  panel.innerHTML =
    '<div class="detail-panel">' +
      '<div class="detail-header"><div class="info"><h2>' + esc(a.name) + '</h2><p>' + esc(a.role) + ' | ' + modelBadge(a.model) + ' | Status: ' + a.status + '</p></div>' +
      '<div class="actions">' +
        (a.status === "idle" ? '<button class="btn-green btn-sm" onclick="toggleAgent(\'' + id + '\',true)">Starten</button>' : '<button class="btn-danger btn-sm" onclick="toggleAgent(\'' + id + '\',false)">Stoppen</button>') +
        '<button class="btn-ghost btn-sm" onclick="editAgent(\'' + id + '\')">Bearbeiten</button>' +
        '<button class="btn-danger btn-sm" onclick="deleteAgent(\'' + id + '\')">Loeschen</button>' +
      '</div></div>' +
      '<div class="detail-tabs">' +
        '<button class="active" onclick="showTab(this,\'chat\')">Chat</button>' +
        '<button onclick="showTab(this,\'tasks\')">Tasks</button>' +
        '<button onclick="showTab(this,\'memory\')">Gedaechtnis</button>' +
        '<button onclick="showTab(this,\'config\')">Konfiguration</button>' +
      '</div>' +
      '<div id="tab-chat" class="tab-content" style="display:flex;flex-direction:column;padding:0">' +
        '<div class="chat-messages" id="chat-msgs"></div>' +
        '<div class="chat-input"><input id="chat-in" placeholder="Nachricht an Agent..." onkeydown="if(event.key===\'Enter\')sendChat()"><button class="btn-primary btn-sm" onclick="sendChat()">Senden</button></div>' +
      '</div>' +
      '<div id="tab-tasks" class="tab-content" style="display:none"></div>' +
      '<div id="tab-memory" class="tab-content" style="display:none"></div>' +
      '<div id="tab-config" class="tab-content" style="display:none"></div>' +
    '</div>';
  loadConversations(id);
  loadTasks(id);
  loadMemory(id);
  loadConfig(a);
}

function showTab(btn, name) {
  var tabs = btn.parentElement.children;
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove("active");
  btn.classList.add("active");
  ["chat","tasks","memory","config"].forEach(function(t) {
    document.getElementById("tab-" + t).style.display = t === name ? (t === "chat" ? "flex" : "block") : "none";
  });
}

async function loadConversations(id) {
  var msgs = await api("/agents/" + id + "/conversations");
  var el = document.getElementById("chat-msgs");
  el.innerHTML = msgs.map(function(m) {
    return '<div class="chat-msg ' + m.role + '">' + esc(m.content) + '</div>';
  }).join("");
  el.scrollTop = el.scrollHeight;
}

async function sendChat() {
  var input = document.getElementById("chat-in");
  var msg = input.value.trim();
  if (!msg) return;
  input.value = "";
  var el = document.getElementById("chat-msgs");
  el.innerHTML += '<div class="chat-msg user">' + esc(msg) + '</div>';
  el.innerHTML += '<div class="chat-msg assistant" id="typing">Denke nach...</div>';
  el.scrollTop = el.scrollHeight;
  try {
    var r = await api("/agents/" + selectedAgent + "/chat", { method: "POST", body: JSON.stringify({ message: msg }) });
    var typing = document.getElementById("typing");
    if (typing) typing.remove();
    el.innerHTML += '<div class="chat-msg assistant">' + esc(r.response) + '</div>';
    el.scrollTop = el.scrollHeight;
  } catch (e) {
    var typing = document.getElementById("typing");
    if (typing) { typing.textContent = "Fehler: " + e.message; typing.id = ""; }
  }
}

async function loadTasks(id) {
  var tasks = await api("/agents/" + id + "/tasks");
  var el = document.getElementById("tab-tasks");
  el.innerHTML = '<div style="margin-bottom:12px;display:flex;gap:8px"><input id="task-in" placeholder="Neuen Task zuweisen..."><button class="btn-primary btn-sm" onclick="assignTask()">Zuweisen</button></div>';
  if (tasks.length === 0) { el.innerHTML += '<div style="color:var(--fg3)">Keine Tasks</div>'; return; }
  el.innerHTML += tasks.map(function(t) {
    return '<div class="task-row"><span class="task-status ' + t.status + '">' + t.status + '</span><span class="task-text">' + esc(t.task) + '</span><span class="task-time">' + timeAgo(new Date(t.created_at)) + '</span></div>' +
      (t.result ? '<div style="padding:4px 0 10px 0;font-size:12px;color:var(--fg2);border-bottom:1px solid var(--border);margin-bottom:4px">' + esc(t.result).substring(0, 500) + '</div>' : '');
  }).join("");
}

async function assignTask() {
  var input = document.getElementById("task-in");
  var task = input.value.trim();
  if (!task) return;
  input.value = "";
  await api("/agents/" + selectedAgent + "/task", { method: "POST", body: JSON.stringify({ task: task }) });
  loadTasks(selectedAgent);
  loadStats();
}

async function loadMemory(id) {
  var mem = await api("/agents/" + id + "/memory");
  var el = document.getElementById("tab-memory");
  el.innerHTML = '<div style="margin-bottom:12px;display:flex;gap:8px"><input id="mem-key" placeholder="Key" style="width:140px"><input id="mem-val" placeholder="Value"><button class="btn-primary btn-sm" onclick="saveMem()">Speichern</button></div>';
  if (mem.length === 0) { el.innerHTML += '<div style="color:var(--fg3)">Kein Gedaechtnis</div>'; return; }
  el.innerHTML += mem.map(function(m) {
    return '<div class="mem-row"><span class="mem-key">' + esc(m.key) + '</span><span class="mem-val">' + esc(m.value) + '</span></div>';
  }).join("");
}

async function saveMem() {
  var key = document.getElementById("mem-key").value.trim();
  var val = document.getElementById("mem-val").value.trim();
  if (!key) return;
  await api("/agents/" + selectedAgent + "/memory", { method: "POST", body: JSON.stringify({ key: key, value: val }) });
  loadMemory(selectedAgent);
}

function loadConfig(a) {
  var el = document.getElementById("tab-config");
  el.innerHTML =
    '<div style="display:grid;gap:12px;max-width:500px">' +
    '<div><label style="font-size:12px;color:var(--fg2)">ID</label><div style="font-family:monospace;font-size:12px;color:var(--fg3)">' + a.id + '</div></div>' +
    '<div><label style="font-size:12px;color:var(--fg2)">KI-Modell</label><div>' + modelBadge(a.model) + '</div></div>' +
    '<div><label style="font-size:12px;color:var(--fg2)">Heartbeat Intervall</label><div>' + a.heartbeat_interval + 's</div></div>' +
    '<div><label style="font-size:12px;color:var(--fg2)">Persoenlichkeit</label><div>' + esc(a.personality || "-") + '</div></div>' +
    '<div><label style="font-size:12px;color:var(--fg2)">System Prompt</label><div style="font-size:12px;white-space:pre-wrap;background:#141414;padding:10px;border-radius:var(--radius);margin-top:4px">' + esc(a.system_prompt || "-") + '</div></div>' +
    '<div><label style="font-size:12px;color:var(--fg2)">Erstellt</label><div>' + new Date(a.created_at).toLocaleString("de-AT") + '</div></div>' +
    '</div>';
}

async function toggleAgent(id, start) {
  await api("/agents/" + id + "/" + (start ? "start" : "stop"), { method: "POST" });
  setTimeout(function() { loadAll(); selectAgent(id); }, 500);
}

async function deleteAgent(id) {
  if (!confirm("Agent wirklich loeschen?")) return;
  await api("/agents/" + id, { method: "DELETE" });
  selectedAgent = null;
  document.getElementById("agent-detail").innerHTML = '<div class="no-selection">Agent auswaehlen oder neuen erstellen</div>';
  loadAll();
}

function showCreateModal() {
  document.getElementById("modal-title").textContent = "Neuer Agent";
  document.getElementById("f-name").value = "";
  document.getElementById("f-role").value = "";
  document.getElementById("f-model").value = "tinyllama-1.1b";
  document.getElementById("f-prompt").value = "";
  document.getElementById("f-personality").value = "";
  document.getElementById("f-heartbeat").value = "60";
  document.getElementById("f-edit-id").value = "";
  document.getElementById("modal-overlay").classList.add("show");
}

function editAgent(id) {
  var a = agents.find(function(x) { return x.id === id; });
  if (!a) return;
  document.getElementById("modal-title").textContent = "Agent bearbeiten";
  document.getElementById("f-name").value = a.name;
  document.getElementById("f-role").value = a.role;
  document.getElementById("f-model").value = a.model;
  document.getElementById("f-prompt").value = a.system_prompt || "";
  document.getElementById("f-personality").value = a.personality || "";
  document.getElementById("f-heartbeat").value = a.heartbeat_interval;
  document.getElementById("f-edit-id").value = id;
  document.getElementById("modal-overlay").classList.add("show");
}

function hideModal() { document.getElementById("modal-overlay").classList.remove("show"); }

async function saveAgent() {
  var editId = document.getElementById("f-edit-id").value;
  var data = {
    name: document.getElementById("f-name").value,
    role: document.getElementById("f-role").value,
    model: document.getElementById("f-model").value,
    system_prompt: document.getElementById("f-prompt").value,
    personality: document.getElementById("f-personality").value,
    heartbeat_interval: parseInt(document.getElementById("f-heartbeat").value) || 60
  };
  if (editId) {
    await api("/agents/" + editId, { method: "PUT", body: JSON.stringify(data) });
  } else {
    var created = await api("/agents", { method: "POST", body: JSON.stringify(data) });
    selectedAgent = created.id;
  }
  hideModal();
  loadAll();
  if (selectedAgent) setTimeout(function() { selectAgent(selectedAgent); }, 300);
}

function esc(s) { if (!s) return ""; var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function timeAgo(date) {
  var s = Math.floor((Date.now() - date.getTime()) / 1000);
  if (s < 5) return "gerade";
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "min";
  if (s < 86400) return Math.floor(s / 3600) + "h";
  return Math.floor(s / 86400) + "d";
}

// Load installed local models into dropdown
async function loadLocalModels() {
  try {
    var r = await fetch("/api/models/installed");
    var models = await r.json();
    var sel = document.getElementById("f-model");
    var group = sel.querySelector('optgroup[label*="Lokal"]');
    if (models.length > 0) {
      group.innerHTML = "";
      models.forEach(function(m) {
        var opt = document.createElement("option");
        opt.value = "local:" + m.name;
        var size = m.size ? " (" + (m.size / 1024 / 1024 / 1024).toFixed(1) + "GB)" : "";
        opt.textContent = m.name + size + " — Kostenlos";
        group.appendChild(opt);
      });
      document.getElementById("local-models-info").textContent = models.length + " lokale Modelle verfuegbar";
    } else {
      document.getElementById("local-models-info").textContent = "Keine lokalen Modelle installiert — Model Browser nutzen";
    }
  } catch(e) {
    document.getElementById("local-models-info").textContent = "Lokale Modelle nicht verfuegbar";
  }
}

// Show model badge in agent detail
function modelBadge(model) {
  if (!model) return "Kein Modell";
  if (model.startsWith("local:")) return model.replace("local:", "") + " (Lokal/Kostenlos)";
  if (model.startsWith("claude")) return model + " (Claude/Bezahlt)";
  if (model.startsWith("gpt") || model.startsWith("o3")) return model + " (OpenAI/Bezahlt)";
  if (model.startsWith("gemini")) return model + " (Google/Bezahlt)";
  return model;
}

// Initial load + polling
loadAll();
loadLocalModels();
setInterval(function() { loadStats(); loadAgents(); }, 5000);
</script>
