<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>KI-Organisator — BLUN</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0a;--card:#141414;--card-border:#1e1e1e;--card-hover:#1a1a1a;
  --fg:#fafafa;--fg2:#a1a1aa;--fg3:#52525b;
  --amber:#3b82f6;--amber-dim:#b45309;--amber-bg:rgba(59,130,246,.08);
  --green:#22c55e;--red:#ef4444;--blue:#3b82f6;
  --radius:8px;--radius-lg:12px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}

.shell{display:flex;height:100dvh;width:100%}

/* Sidebar */
.sidebar{width:280px;background:var(--card);border-right:1px solid var(--card-border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:20px;border-bottom:1px solid var(--card-border)}
.sidebar-header h2{font-size:16px;font-weight:700;color:var(--amber);margin-bottom:4px}
.sidebar-header p{font-size:11px;color:var(--fg3)}
.sidebar-stats{padding:16px 20px;border-bottom:1px solid var(--card-border)}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12px}
.stat-row .label{color:var(--fg3)}
.stat-row .value{font-weight:600;font-variant-numeric:tabular-nums}
.stat-row .value.green{color:var(--green)}
.stat-row .value.red{color:var(--red)}
.stat-row .value.amber{color:var(--amber)}

.sidebar-suggestions{flex:1;overflow-y:auto;padding:12px}
.sidebar-suggestions h3{font-size:11px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;padding:0 8px}
.suggestion-card{background:var(--bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.suggestion-card:hover{border-color:var(--amber-dim)}
.suggestion-card .title{font-size:12px;font-weight:600;margin-bottom:2px}
.suggestion-card .desc{font-size:11px;color:var(--fg2);line-height:1.4}
.suggestion-card.warning{border-left:3px solid var(--red)}
.suggestion-card.info{border-left:3px solid var(--blue)}
.suggestion-card.success{border-left:3px solid var(--green)}

.sidebar-footer{padding:12px 20px;border-top:1px solid var(--card-border)}
.sidebar-footer a{color:var(--fg3);font-size:11px;text-decoration:none}
.sidebar-footer a:hover{color:var(--fg)}

/* Main chat area */
.main{flex:1;display:flex;flex-direction:column;min-width:0}

.topbar{height:52px;border-bottom:1px solid var(--card-border);display:flex;align-items:center;padding:0 24px;gap:12px}
.topbar-title{font-size:15px;font-weight:600;flex:1}
.topbar-actions{display:flex;gap:8px}
.topbar-btn{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);color:var(--fg2);font-size:12px;padding:6px 12px;cursor:pointer;font-family:var(--font);transition:all .15s}
.topbar-btn:hover{border-color:var(--amber-dim);color:var(--fg)}

.chat-area{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}

.msg{max-width:720px;line-height:1.6}
.msg.bot{align-self:flex-start}
.msg.user{align-self:flex-end}
.msg-bubble{padding:12px 16px;border-radius:var(--radius-lg);font-size:13px}
.msg.bot .msg-bubble{background:var(--card);border:1px solid var(--card-border)}
.msg.user .msg-bubble{background:var(--amber-bg);border:1px solid rgba(59,130,246,.2)}
.msg-sender{font-size:10px;color:var(--fg3);margin-bottom:4px;font-weight:500}
.msg-bubble strong{color:var(--amber);font-weight:600}
.msg-bubble p{margin:4px 0}
.msg-bubble ul,.msg-bubble ol{margin:4px 0 4px 16px}
.msg-bubble li{margin:2px 0}

/* Input area */
.input-area{border-top:1px solid var(--card-border);padding:16px 24px;display:flex;gap:12px;align-items:flex-end}
.input-area textarea{flex:1;background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);color:var(--fg);font-family:var(--font);font-size:13px;padding:10px 14px;resize:none;min-height:42px;max-height:120px;outline:none;transition:border-color .15s}
.input-area textarea:focus{border-color:var(--amber-dim)}
.input-area textarea::placeholder{color:var(--fg3)}
.send-btn{background:var(--amber);color:#000;border:none;border-radius:var(--radius);padding:10px 20px;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s;flex-shrink:0}
.send-btn:hover{opacity:.9}
.send-btn:disabled{opacity:.4;cursor:default}

/* Loading */
.typing{display:flex;gap:4px;padding:4px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--fg3);animation:bounce .6s infinite alternate}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{to{opacity:.3;transform:translateY(-4px)}}

/* Markdown-lite */
.md-content{white-space:pre-wrap;word-break:break-word}

/* Mobile */
@media(max-width:768px){
  .sidebar{display:none}
}
</style>
</head>
<body>
<div class="shell">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>KI-Organisator</h2>
      <p>Meta-AI System Manager</p>
    </div>
    <div class="sidebar-stats" id="stats">
      <div class="stat-row"><span class="label">Companies</span><span class="value" id="s-companies">—</span></div>
      <div class="stat-row"><span class="label">Agents</span><span class="value" id="s-agents">—</span></div>
      <div class="stat-row"><span class="label">Active</span><span class="value green" id="s-active">—</span></div>
      <div class="stat-row"><span class="label">Errors</span><span class="value red" id="s-errors">—</span></div>
      <div class="stat-row"><span class="label">Processes</span><span class="value" id="s-processes">—</span></div>
      <div class="stat-row"><span class="label">Pending Tasks</span><span class="value amber" id="s-tasks">—</span></div>
      <div class="stat-row"><span class="label">30d Cost</span><span class="value" id="s-cost">—</span></div>
    </div>
    <div class="sidebar-suggestions" id="suggestions">
      <h3>Suggestions</h3>
      <div id="suggestion-list"></div>
    </div>
    <div class="sidebar-footer">
      <a href="/dashboard">&larr; Back to Dashboard</a>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-title">Organisator Chat</div>
      <div class="topbar-actions">
        <button class="topbar-btn" onclick="triggerScan()">Scan System</button>
        <button class="topbar-btn" onclick="clearChat()">Clear</button>
      </div>
    </div>

    <div class="chat-area" id="chat"></div>

    <div class="input-area">
      <textarea id="input" placeholder="Ask the Organisator anything... (try: help, status, show agents)" rows="1" onkeydown="handleKey(event)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()">Send</button>
    </div>
  </div>
</div>

<script>
var chatEl = document.getElementById('chat');
var inputEl = document.getElementById('input');
var sendBtn = document.getElementById('sendBtn');

// Auto-resize textarea
inputEl.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}

function addMessage(text, sender) {
  var div = document.createElement('div');
  div.className = 'msg ' + sender;
  var senderLabel = sender === 'bot' ? 'KI-Organisator' : 'You';
  div.innerHTML = '<div class="msg-sender">' + senderLabel + '</div><div class="msg-bubble"><div class="md-content">' + renderMd(text) + '</div></div>';
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function addTyping() {
  var div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typing';
  div.innerHTML = '<div class="msg-sender">KI-Organisator</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function removeTyping() {
  var el = document.getElementById('typing');
  if (el) el.remove();
}

function renderMd(text) {
  if (!text) return '';
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

async function send() {
  var msg = inputEl.value.trim();
  if (!msg) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;

  addMessage(msg, 'user');
  addTyping();

  try {
    var resp = await fetch('/organisator/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg })
    });
    var data = await resp.json();
    removeTyping();
    if (data.error) {
      addMessage('Error: ' + data.error, 'bot');
    } else {
      addMessage(data.text || JSON.stringify(data), 'bot');
    }
    refreshStatus();
  } catch (err) {
    removeTyping();
    addMessage('Connection error: ' + err.message, 'bot');
  }
  sendBtn.disabled = false;
  inputEl.focus();
}

async function refreshStatus() {
  try {
    var resp = await fetch('/organisator/status');
    var d = await resp.json();
    document.getElementById('s-companies').textContent = d.companies || 0;
    document.getElementById('s-agents').textContent = d.agents || 0;
    document.getElementById('s-active').textContent = d.activeAgents || 0;
    document.getElementById('s-errors').textContent = d.errorAgents || 0;
    document.getElementById('s-processes').textContent = d.runningProcesses || 0;
    document.getElementById('s-tasks').textContent = d.pendingTasks || 0;
    document.getElementById('s-cost').textContent = '$' + (d.totalCost30d || '0.00');
  } catch (e) {}
}

async function refreshSuggestions() {
  try {
    var resp = await fetch('/organisator/suggestions');
    var d = await resp.json();
    var list = document.getElementById('suggestion-list');
    list.innerHTML = '';
    (d.data || []).forEach(function(s) {
      var card = document.createElement('div');
      card.className = 'suggestion-card ' + (s.type || 'info');
      card.innerHTML = '<div class="title">' + s.title + '</div><div class="desc">' + s.description + '</div>';
      card.onclick = function() {
        inputEl.value = s.title;
        send();
      };
      list.appendChild(card);
    });
  } catch (e) {}
}

async function triggerScan() {
  addMessage('Scanning system...', 'user');
  addTyping();
  try {
    var resp = await fetch('/organisator/scan', { method: 'POST' });
    var d = await resp.json();
    removeTyping();
    addMessage('**Scan complete.** ' + d.agents + ' agents, ' + d.companies + ' companies, ' + d.pendingTasks + ' pending tasks.', 'bot');
    refreshStatus();
    refreshSuggestions();
  } catch (e) {
    removeTyping();
    addMessage('Scan failed: ' + e.message, 'bot');
  }
}

function clearChat() {
  chatEl.innerHTML = '';
  showWelcome();
}

function showWelcome() {
  addMessage(
    "**Welcome to the KI-Organisator.**\n\n" +
    "I'm your AI CTO — I manage all companies, agents, skills, and resources in BLUN.\n\n" +
    "**Quick commands:**\n" +
    "- **status** — System overview\n" +
    "- **show agents** — List all agents\n" +
    "- **show companies** — List companies\n" +
    "- **create company [name]** — New company\n" +
    "- **create agent [name]** — New agent\n" +
    "- **start/stop/restart agent [name]** — Control agents\n" +
    "- **costs** — Spending report\n" +
    "- **suggestions** — What should I do next?\n" +
    "- **help** — Full command list\n\n" +
    "Just type naturally — I'll figure out what you need.",
    'bot'
  );
}

// Init
showWelcome();
refreshStatus();
refreshSuggestions();
setInterval(refreshStatus, 30000);
setInterval(refreshSuggestions, 60000);
</script>
</body>
</html>
