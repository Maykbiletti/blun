<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLUN - Server Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Inter",sans-serif;background:#0a0a0a;color:#e5e5e5;min-height:100vh;padding:24px}
a{color:#3b82f6;text-decoration:none}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.header h1{font-size:22px;font-weight:700}
.header-right{display:flex;align-items:center;gap:16px}
.back-link{font-size:14px;color:#a3a3a3}
.back-link:hover{color:#3b82f6}
.refresh-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.status-text{font-size:12px;color:#a3a3a3}
.banner{background:#dc2626;color:#fff;padding:14px 20px;border-radius:10px;font-weight:600;margin-bottom:20px;display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:20px}
.card-label{font-size:13px;color:#a3a3a3;margin-bottom:6px}
.card-value{font-size:32px;font-weight:700;color:#3b82f6}
.card-sub{font-size:12px;color:#a3a3a3;margin-top:4px}
.section-title{font-size:16px;font-weight:600;margin-bottom:12px;margin-top:8px}
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;font-size:12px;color:#a3a3a3;padding:8px 12px;border-bottom:1px solid #2a2a2a}
.table td{padding:10px 12px;border-bottom:1px solid #2a2a2a;font-size:14px}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:500;background:#1e3a5f;color:#3b82f6}
.bar-bg{height:8px;background:#2a2a2a;border-radius:4px;overflow:hidden;margin-top:6px}
.bar-fill{height:100%;border-radius:4px;background:#3b82f6;transition:width .5s}
.bar-fill.warn{background:#f59e0b}
.bar-fill.danger{background:#ef4444}
.rate-limit-circle{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px}
.circle{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:28px;border:4px solid;transition:all .3s}
.circle.green{background:#22c55e;border-color:#16a34a;box-shadow:0 0 20px rgba(34,197,94,.5)}
.circle.yellow{background:#f59e0b;border-color:#d97706;box-shadow:0 0 20px rgba(245,158,11,.5)}
.circle.red{background:#ef4444;border-color:#dc2626;box-shadow:0 0 20px rgba(239,68,68,.5)}
.circle-label{font-size:13px;color:#a3a3a3;text-align:center;width:100%}
.circle-percent{font-size:11px;color:#a3a3a3;text-align:center;font-weight:400}
</style>
</head>
<body>
<div class="header">
  <h1>Server Monitor</h1>
  <div class="header-right">
    <a href="/dashboard" class="back-link">Zurueck zum Dashboard</a>
    <div class="refresh-dot"></div>
    <span class="status-text" id="lastUpdate">-</span>
  </div>
</div>
<div class="banner" id="overloadBanner">Server ueberlastet - RAM Auslastung ueber 85%</div>

<div class="grid">
  <div class="card"><div class="card-label">CPU Auslastung</div><div class="card-value" id="cpuVal">-</div><div class="card-sub" id="cpuCores">-</div><div class="bar-bg"><div class="bar-fill" id="cpuBar" style="width:0"></div></div></div>
  <div class="card"><div class="card-label">RAM</div><div class="card-value" id="ramVal">-</div><div class="card-sub" id="ramSub">-</div><div class="bar-bg"><div class="bar-fill" id="ramBar" style="width:0"></div></div></div>
  <div class="card"><div class="card-label">Festplatte</div><div class="card-value" id="diskVal">-</div><div class="card-sub" id="diskSub">-</div><div class="bar-bg"><div class="bar-fill" id="diskBar" style="width:0"></div></div></div>
  <div class="card"><div class="card-label">Aktive Sessions</div><div class="card-value" id="sessVal">-</div><div class="card-sub">Letzte 15 Minuten</div></div>
  <div class="card"><div class="card-label">API Anfragen</div><div class="card-value" id="reqVal">-</div><div class="card-sub" id="reqSub">-</div></div>
  <div class="card"><div class="card-label">Betriebszeit</div><div class="card-value" id="uptimeVal">-</div><div class="card-sub">Stunden</div></div>
</div>

<div class="section-title">Rate-Limit Status</div>
<div class="grid" id="rateLimitGrid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:24px">
  <!-- Rate-Limit Kreise werden hier eingefügt -->
</div>

<div class="section-title">Laufende Modelle</div>
<div class="card" style="margin-bottom:24px">
  <table class="table">
    <thead><tr><th>PID</th><th>Modell</th><th>Port</th><th>RAM (MB)</th></tr></thead>
    <tbody id="llamaTable"><tr><td colspan="4" style="color:#a3a3a3">Laden...</td></tr></tbody>
  </table>
</div>

<script>
function api(url){return fetch(url,{credentials:"include"}).then(function(r){if(r.status===401){window.location.href="/login";return Promise.reject("auth")}return r.json()})}
function barClass(pct){if(pct>85)return"danger";if(pct>60)return"warn";return""}
function esc(s){var d=document.createElement("div");d.textContent=String(s||"");return d.innerHTML}
function refresh(){
  api("/api/monitor").then(function(d){
    document.getElementById("cpuVal").textContent=d.cpu.percent+"%";
    document.getElementById("cpuCores").textContent=d.cpu.cores+" Kerne";
    var cpuBar=document.getElementById("cpuBar");cpuBar.style.width=d.cpu.percent+"%";cpuBar.className="bar-fill "+barClass(d.cpu.percent);
    document.getElementById("ramVal").textContent=d.ram.percent+"%";
    document.getElementById("ramSub").textContent=d.ram.used_gb+" / "+d.ram.total_gb+" GB";
    var ramBar=document.getElementById("ramBar");ramBar.style.width=d.ram.percent+"%";ramBar.className="bar-fill "+barClass(d.ram.percent);
    var diskPct=parseInt(d.disk.percent)||0;
    document.getElementById("diskVal").textContent=d.disk.percent;
    document.getElementById("diskSub").textContent=d.disk.used+" / "+d.disk.total;
    var diskBar=document.getElementById("diskBar");diskBar.style.width=diskPct+"%";diskBar.className="bar-fill "+barClass(diskPct);
    document.getElementById("sessVal").textContent=d.active_sessions;
    document.getElementById("reqVal").textContent=d.requests.count;
    document.getElementById("reqSub").textContent="Seit "+new Date(d.requests.since).toLocaleString("de");
    document.getElementById("uptimeVal").textContent=d.uptime_hours;
    document.getElementById("overloadBanner").style.display=d.overloaded?"block":"none";
    var html="";
    if(d.llama_processes.length===0){html='<tr><td colspan="4" style="color:#a3a3a3">Keine Modelle aktiv</td></tr>';}
    else{d.llama_processes.forEach(function(p){html+='<tr><td>'+esc(p.pid)+'</td><td>'+esc(p.model)+'</td><td><span class="tag">:'+esc(p.port)+'</span></td><td>'+esc(p.ram_mb)+'</td></tr>';});}
    document.getElementById("llamaTable").innerHTML=html;
    document.getElementById("lastUpdate").textContent="Aktualisiert: "+new Date().toLocaleTimeString("de");
  }).catch(function(e){if(e!=="auth")console.error(e)});
}
function refreshRateLimit(){
  api("/api/rate-limit-status").then(function(d){
    var providers=["Anthropic","OpenAI","Google","Lokal"];
    var html="";
    providers.forEach(function(p){
      var key=p.toLowerCase();
      var data=d[key]||{remaining:0,limit:0};
      var pct=data.limit>0?Math.round((data.remaining/data.limit)*100):0;
      var color=pct>60?"green":pct>30?"yellow":"red";
      html+='<div class="rate-limit-circle">';
      html+='<div class="circle '+color+'">'+pct+'%</div>';
      html+='<div class="circle-label">'+p+'</div>';
      html+='<div class="circle-percent">'+data.remaining+' / '+data.limit+'</div>';
      html+='</div>';
    });
    document.getElementById("rateLimitGrid").innerHTML=html;
  }).catch(function(e){if(e!=="auth")console.error("Rate-Limit Error:",e)});
}
refreshRateLimit();
setInterval(refreshRateLimit,30000);
refresh();
setInterval(refresh,10000);
</script>
</body>
</html>
