<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLUN — Sign In</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e5e5e5;font-family:'Inter',system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
a{color:#f59e0b;text-decoration:none}
.container{width:100%;max-width:420px;padding:2rem}
.logo{text-align:center;margin-bottom:2.5rem}
.logo h1{font-size:2rem;font-weight:700;color:#fff;letter-spacing:-.02em}
.logo p{color:#737373;font-size:.875rem;margin-top:.25rem}
.card{background:#141414;border:1px solid #262626;border-radius:12px;padding:2rem}
.tabs{display:flex;gap:0;margin-bottom:1.5rem;background:#0a0a0a;border-radius:8px;padding:3px}
.tab{flex:1;padding:.5rem;text-align:center;font-size:.875rem;font-weight:500;color:#737373;border:none;background:none;cursor:pointer;border-radius:6px;transition:all .2s}
.tab.active{background:#262626;color:#fff}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:.8rem;color:#a3a3a3;margin-bottom:.375rem;font-weight:500}
.form-group input{width:100%;padding:.625rem .75rem;background:#0a0a0a;border:1px solid #262626;border-radius:8px;color:#fff;font-size:.875rem;outline:none;transition:border-color .2s}
.form-group input:focus{border-color:#f59e0b}
.btn-primary{width:100%;padding:.75rem;background:#f59e0b;color:#0a0a0a;border:none;border-radius:8px;font-size:.875rem;font-weight:600;cursor:pointer;margin-top:.5rem;transition:background .2s}
.btn-primary:hover{background:#d97706}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.divider{display:flex;align-items:center;gap:1rem;margin:1.25rem 0;color:#525252;font-size:.75rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#262626}
.btn-oauth{width:100%;padding:.625rem;background:#1a1a1a;border:1px solid #262626;border-radius:8px;color:#e5e5e5;font-size:.8rem;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.5rem;margin-bottom:.5rem;transition:border-color .2s}
.btn-oauth:hover{border-color:#404040}
.btn-oauth svg{width:18px;height:18px}
.error{background:#451a03;border:1px solid #92400e;color:#fbbf24;padding:.625rem .75rem;border-radius:8px;font-size:.8rem;margin-bottom:1rem;display:none}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <h1>BLUN</h1>
    <p>AI Organisator</p>
  </div>
  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Sign In</button>
      <button class="tab" onclick="switchTab('register')">Create Account</button>
    </div>
    <div id="error" class="error"></div>
    <form id="authForm" onsubmit="handleSubmit(event)">
      <div id="nameField" class="form-group hidden">
        <label>Name</label>
        <input type="text" id="name" placeholder="Your name" autocomplete="name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Min. 8 characters" required autocomplete="current-password" minlength="8">
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Sign In</button>
    </form>
    <div class="divider">or continue with</div>
    <button class="btn-oauth" onclick="oauthLogin('github')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
      GitHub
    </button>
    <button class="btn-oauth" onclick="oauthLogin('google')">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google
    </button>
  </div>
</div>
<script>
var mode = 'login';
function switchTab(m) {
  mode = m;
  document.querySelectorAll('.tab').forEach(function(t, i) {
    t.classList.toggle('active', (i === 0 && m === 'login') || (i === 1 && m === 'register'));
  });
  document.getElementById('nameField').classList.toggle('hidden', m === 'login');
  document.getElementById('submitBtn').textContent = m === 'login' ? 'Sign In' : 'Create Account';
  document.getElementById('error').style.display = 'none';
}
function showError(msg) {
  var el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
}
async function handleSubmit(e) {
  e.preventDefault();
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  document.getElementById('error').style.display = 'none';
  var body = { email: document.getElementById('email').value, password: document.getElementById('password').value };
  if (mode === 'register') body.name = document.getElementById('name').value;
  try {
    var res = await fetch('/auth/' + mode, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    var data = await res.json();
    if (!res.ok) { showError(data.error || 'Something went wrong'); btn.disabled = false; return; }
    localStorage.setItem('blun_token', data.token);
    localStorage.setItem('blun_user', JSON.stringify(data.user));
    window.location.href = '/dashboard';
  } catch (err) {
    showError('Network error — please try again');
    btn.disabled = false;
  }
}
function oauthLogin(provider) {
  window.location.href = '/auth/' + provider;
}
if (localStorage.getItem('blun_token')) {
  fetch('/auth/me', { headers: { 'Authorization': 'Bearer ' + localStorage.getItem('blun_token') } })
    .then(function(r) { if (r.ok) window.location.href = '/dashboard'; else { localStorage.removeItem('blun_token'); localStorage.removeItem('blun_user'); } })
    .catch(function() {});
}
</script>
</body>
</html>
