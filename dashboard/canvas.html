<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Canvas - BLUN</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--surface:#111;--surface2:#1a1a1a;--border:#222;--text:#e5e5e5;--text2:#888;--accent:#22d3ee;--accent2:#a78bfa}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}
/* Top bar */
.topbar{height:40px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0}
.topbar .logo{font-weight:700;font-size:13px;color:var(--accent);letter-spacing:1px}
.topbar .sep{color:var(--border);margin:0 4px}
.topbar .project-name{font-size:13px;color:var(--text2)}
.topbar .spacer{flex:1}
.topbar button{background:none;border:1px solid var(--border);color:var(--text2);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;font-family:inherit}
.topbar button:hover{border-color:var(--accent);color:var(--accent)}
.topbar .conn-status{width:8px;height:8px;border-radius:50%;background:#555;margin-left:8px}
.topbar .conn-status.connected{background:#22c55e}
/* Main layout */
.main{display:flex;flex:1;overflow:hidden}
/* Sidebar */
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
.sidebar.collapsed{width:0;overflow:hidden}
.sidebar-header{padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text2);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.sidebar-header button{background:none;border:none;color:var(--text2);cursor:pointer;font-size:14px}
.file-tree{flex:1;overflow-y:auto;padding:4px 0}
.file-item{padding:5px 12px 5px 20px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--text2)}
.file-item:hover{background:var(--surface2);color:var(--text)}
.file-item.active{background:rgba(34,211,238,.1);color:var(--accent)}
.file-icon{font-size:11px;width:14px;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:700}
.file-actions{padding:8px;border-top:1px solid var(--border)}
.file-actions button{width:100%;padding:5px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:4px;cursor:pointer;font-size:11px;font-family:inherit}
.file-actions button:hover{border-color:var(--accent);color:var(--accent)}
/* Editor area */
.editor-area{flex:1;display:flex;flex-direction:column;min-width:0}
/* Tabs */
.tab-bar{height:34px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;flex-shrink:0}
.tab{padding:0 14px;height:34px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);cursor:pointer;border-right:1px solid var(--border);white-space:nowrap;flex-shrink:0}
.tab:hover{background:var(--surface2)}
.tab.active{background:var(--bg);color:var(--text);border-bottom:2px solid var(--accent)}
.tab .close{font-size:14px;opacity:.5;margin-left:4px}
.tab .close:hover{opacity:1;color:#f87171}
/* Code editor */
.editor-wrap{flex:1;position:relative;overflow:hidden;display:flex}
.line-numbers{width:50px;background:var(--surface);padding:10px 0;overflow:hidden;text-align:right;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.6;color:#444;user-select:none;flex-shrink:0}
.line-numbers div{padding-right:10px}
.editor-container{flex:1;position:relative;overflow:auto}
.highlight-layer{position:absolute;top:0;left:0;right:0;padding:10px 10px 10px 8px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;pointer-events:none;color:transparent;tab-size:2}
.code-input{position:absolute;top:0;left:0;width:100%;min-height:100%;padding:10px 10px 10px 8px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.6;background:transparent;color:var(--text);border:none;outline:none;resize:none;white-space:pre-wrap;word-wrap:break-word;tab-size:2;caret-color:var(--accent);overflow:hidden}
/* Remote cursors */
.remote-cursor{position:absolute;width:2px;height:1.6em;animation:blink 1s step-end infinite;pointer-events:none;z-index:10}
.remote-cursor-label{position:absolute;top:-18px;left:0;font-size:10px;padding:1px 4px;border-radius:2px;white-space:nowrap;font-family:'Inter',sans-serif}
@keyframes blink{50%{opacity:0}}
/* Agent panel (right) */
.agent-panel{width:280px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
.agent-panel.collapsed{width:0;overflow:hidden}
.agent-panel-header{padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text2);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.agent-panel-header button{background:none;border:none;color:var(--text2);cursor:pointer;font-size:14px}
.agent-activity{flex:1;overflow-y:auto;padding:8px}
.agent-event{padding:6px 8px;font-size:11px;color:var(--text2);border-bottom:1px solid var(--border)}
.agent-event .name{font-weight:600}
.agent-input-wrap{padding:8px;border-top:1px solid var(--border)}
.agent-input-wrap textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:4px;font-size:12px;font-family:inherit;resize:none;height:60px;outline:none}
.agent-input-wrap textarea:focus{border-color:var(--accent)}
/* Status bar */
.statusbar{height:24px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 12px;font-size:11px;color:var(--text2);gap:16px;flex-shrink:0}
.statusbar .spacer{flex:1}
/* Project picker modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;width:400px;max-width:90vw}
.modal h3{font-size:15px;margin-bottom:12px}
.modal input,.modal textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:4px;font-size:13px;font-family:inherit;margin-bottom:8px;outline:none}
.modal input:focus,.modal textarea:focus{border-color:var(--accent)}
.modal .btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.modal button{padding:6px 16px;border-radius:4px;font-size:12px;font-family:inherit;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text)}
.modal button.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
.project-list{max-height:200px;overflow-y:auto;margin-bottom:12px}
.project-item{padding:8px 10px;cursor:pointer;border-radius:4px;font-size:13px}
.project-item:hover{background:var(--surface2)}
/* Syntax highlighting colors */
.hl-keyword{color:#c084fc}
.hl-string{color:#86efac}
.hl-number{color:#fbbf24}
.hl-comment{color:#555;font-style:italic}
.hl-function{color:#22d3ee}
.hl-operator{color:#f472b6}
.hl-tag{color:#f87171}
.hl-attr{color:#fbbf24}
.hl-type{color:#22d3ee}
.hl-punct{color:#666}
.hl-property{color:#7dd3fc}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
</style>
</head>
<body>
<div class="topbar">
  <span class="logo">BLUN</span>
  <span class="sep">/</span>
  <span class="project-name" id="projectName">Code Canvas</span>
  <span class="spacer"></span>
  <button onclick="toggleSidebar()">Files</button>
  <button onclick="toggleAgentPanel()">Agents</button>
  <button onclick="showProjectPicker()">Projects</button>
  <div class="conn-status" id="connStatus"></div>
</div>
<div class="main">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span>Explorer</span>
      <button onclick="toggleSidebar()">x</button>
    </div>
    <div class="file-tree" id="fileTree"></div>
    <div class="file-actions">
      <button onclick="showNewFileDialog()">+ New File</button>
    </div>
  </div>
  <div class="editor-area">
    <div class="tab-bar" id="tabBar"></div>
    <div class="editor-wrap">
      <div class="line-numbers" id="lineNumbers"></div>
      <div class="editor-container" id="editorContainer">
        <div class="highlight-layer" id="highlightLayer"></div>
        <textarea class="code-input" id="codeInput" spellcheck="false" placeholder="Open a file to start editing..."></textarea>
      </div>
    </div>
  </div>
  <div class="agent-panel" id="agentPanel">
    <div class="agent-panel-header">
      <span>Agent Activity</span>
      <button onclick="toggleAgentPanel()">x</button>
    </div>
    <div class="agent-activity" id="agentActivity"></div>
    <div class="agent-input-wrap">
      <textarea placeholder="Send instruction to agent..."></textarea>
    </div>
  </div>
</div>
<div class="statusbar">
  <span id="statusLang">plaintext</span>
  <span id="statusCursor">Ln 1, Col 1</span>
  <span class="spacer"></span>
  <span id="statusUsers">1 user</span>
  <span>UTF-8</span>
</div>

<div class="modal-overlay" id="projectModal" style="display:none">
  <div class="modal">
    <h3>Projects</h3>
    <div class="project-list" id="projectList"></div>
    <hr style="border-color:var(--border);margin:8px 0">
    <input id="newProjectName" placeholder="New project name...">
    <div class="btn-row">
      <button onclick="closeProjectModal()">Cancel</button>
      <button class="primary" onclick="createProject()">Create</button>
    </div>
  </div>
</div>

<script>
const API = '';
let ws = null;
let currentProject = null;
let currentFile = null;
let openTabs = [];
let files = [];
let myUserId = null;
let myUserName = '';
let myColor = '';
let remoteCursors = {};
let suppressSend = false;

// --- WebSocket ---
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host + '?role=canvas');
  ws.onopen = () => { document.getElementById('connStatus').classList.add('connected'); };
  ws.onclose = () => {
    document.getElementById('connStatus').classList.remove('connected');
    setTimeout(connectWS, 2000);
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    handleWSMessage(msg);
  };
}

function handleWSMessage(msg) {
  switch (msg.type) {
    case 'canvas.ready':
      myUserId = msg.userId;
      myUserName = msg.userName;
      myColor = msg.color;
      break;
    case 'file.content':
      // received after file.open
      break;
    case 'file.edit':
      if (msg.fileId === currentFile?.id && msg.editorId !== myUserId) {
        suppressSend = true;
        const inp = document.getElementById('codeInput');
        const pos = inp.selectionStart;
        inp.value = msg.content;
        inp.selectionStart = inp.selectionEnd = pos;
        updateHighlight();
        updateLineNumbers();
        suppressSend = false;
        addAgentEvent(msg.editorName, msg.editorColor, 'editing line ' + (msg.cursorLine || '?'));
      }
      break;
    case 'file.saved':
      addAgentEvent(msg.by, null, 'saved file');
      break;
    case 'cursor.move':
      updateRemoteCursor(msg);
      break;
    case 'cursor.leave':
      removeRemoteCursor(msg.userId);
      break;
    case 'user.joined':
      addAgentEvent(msg.userName, msg.color, 'joined');
      updateUserCount();
      break;
  }
}

function sendWS(msg) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
}

// --- Projects ---
async function loadProjects() {
  const res = await fetch(API + '/canvas/projects', { credentials: 'include' });
  return res.json();
}

async function showProjectPicker() {
  const projects = await loadProjects();
  const list = document.getElementById('projectList');
  list.innerHTML = projects.map(p =>
    '<div class="project-item" onclick="openProject(\'' + p.id + '\',\'' + esc(p.name) + '\')">' + esc(p.name) + '</div>'
  ).join('') || '<div style="color:var(--text2);font-size:12px;padding:8px">No projects yet</div>';
  document.getElementById('projectModal').style.display = 'flex';
}

function closeProjectModal() { document.getElementById('projectModal').style.display = 'none'; }

async function createProject() {
  const name = document.getElementById('newProjectName').value.trim();
  if (!name) return;
  const res = await fetch(API + '/canvas/projects', {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name })
  });
  const p = await res.json();
  document.getElementById('newProjectName').value = '';
  openProject(p.id, p.name);
  closeProjectModal();
}

async function openProject(id, name) {
  currentProject = { id, name };
  document.getElementById('projectName').textContent = name;
  closeProjectModal();
  openTabs = [];
  currentFile = null;
  document.getElementById('codeInput').value = '';
  updateHighlight();
  updateLineNumbers();
  renderTabs();
  await loadFiles();
}

// --- Files ---
async function loadFiles() {
  if (!currentProject) return;
  const res = await fetch(API + '/canvas/projects/' + currentProject.id + '/files', { credentials: 'include' });
  files = await res.json();
  renderFileTree();
}

function renderFileTree() {
  const tree = document.getElementById('fileTree');
  tree.innerHTML = files.map(f => {
    const name = f.path.split('/').pop();
    const icon = fileIcon(f.language || detectLang(f.path));
    const active = currentFile && currentFile.id === f.id ? ' active' : '';
    return '<div class="file-item' + active + '" onclick="openFile(\'' + f.id + '\')">' +
      '<span class="file-icon">' + icon + '</span>' + esc(name) + '</div>';
  }).join('');
}

function fileIcon(lang) {
  const m = {javascript:'JS',typescript:'TS',python:'PY',html:'<>',css:'#',sql:'Q',json:'{}',markdown:'M',bash:'$',ruby:'RB',go:'GO',rust:'RS'};
  return m[lang] || '~';
}

function detectLang(p) {
  const ext = p.split('.').pop().toLowerCase();
  const m = {js:'javascript',ts:'typescript',py:'python',html:'html',css:'css',sql:'sql',json:'json',md:'markdown',sh:'bash'};
  return m[ext] || 'plaintext';
}

async function openFile(id) {
  const res = await fetch(API + '/canvas/files/' + id, { credentials: 'include' });
  const file = await res.json();
  currentFile = file;
  // Add tab if not open
  if (!openTabs.find(t => t.id === id)) openTabs.push({ id: file.id, name: file.path.split('/').pop(), language: file.language });
  renderTabs();
  renderFileTree();
  const inp = document.getElementById('codeInput');
  inp.value = file.content || '';
  updateHighlight();
  updateLineNumbers();
  document.getElementById('statusLang').textContent = file.language || 'plaintext';
  // Tell WS we opened this file
  sendWS({ type: 'file.open', fileId: id });
}

function closeTab(id, ev) {
  ev.stopPropagation();
  openTabs = openTabs.filter(t => t.id !== id);
  if (currentFile && currentFile.id === id) {
    if (openTabs.length) openFile(openTabs[openTabs.length - 1].id);
    else { currentFile = null; document.getElementById('codeInput').value = ''; updateHighlight(); updateLineNumbers(); }
  }
  renderTabs();
}

function renderTabs() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = openTabs.map(t => {
    const active = currentFile && currentFile.id === t.id ? ' active' : '';
    return '<div class="tab' + active + '" onclick="openFile(\'' + t.id + '\')">' +
      esc(t.name) + '<span class="close" onclick="closeTab(\'' + t.id + '\',event)">x</span></div>';
  }).join('');
}

async function showNewFileDialog() {
  if (!currentProject) { showProjectPicker(); return; }
  const path = prompt('File path (e.g. src/index.js):');
  if (!path) return;
  const res = await fetch(API + '/canvas/projects/' + currentProject.id + '/files', {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path, content: '' })
  });
  const f = await res.json();
  await loadFiles();
  openFile(f.id);
}

// --- Editor ---
const codeInput = document.getElementById('codeInput');
const highlightLayer = document.getElementById('highlightLayer');

codeInput.addEventListener('input', () => {
  updateHighlight();
  updateLineNumbers();
  if (!suppressSend && currentFile) {
    const lines = codeInput.value.substring(0, codeInput.selectionStart).split('\n');
    const line = lines.length;
    const col = lines[lines.length - 1].length + 1;
    sendWS({ type: 'file.edit', fileId: currentFile.id, content: codeInput.value, cursorLine: line, cursorCol: col });
  }
});

codeInput.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = codeInput.selectionStart;
    const end = codeInput.selectionEnd;
    codeInput.value = codeInput.value.substring(0, start) + '  ' + codeInput.value.substring(end);
    codeInput.selectionStart = codeInput.selectionEnd = start + 2;
    codeInput.dispatchEvent(new Event('input'));
  }
  if (e.key === 's' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    if (currentFile) {
      sendWS({ type: 'file.save', fileId: currentFile.id, content: codeInput.value });
      fetch(API + '/canvas/files/' + currentFile.id, {
        method: 'PUT', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: codeInput.value })
      });
    }
  }
});

codeInput.addEventListener('click', updateCursorStatus);
codeInput.addEventListener('keyup', updateCursorStatus);

function updateCursorStatus() {
  const val = codeInput.value.substring(0, codeInput.selectionStart);
  const lines = val.split('\n');
  const line = lines.length;
  const col = lines[lines.length - 1].length + 1;
  document.getElementById('statusCursor').textContent = 'Ln ' + line + ', Col ' + col;
  if (currentFile) sendWS({ type: 'cursor.move', fileId: currentFile.id, line, col });
}

// Sync scroll
document.getElementById('editorContainer').addEventListener('scroll', function() {
  document.getElementById('lineNumbers').style.transform = 'translateY(-' + this.scrollTop + 'px)';
});

function updateLineNumbers() {
  const lines = (codeInput.value || '').split('\n').length;
  const el = document.getElementById('lineNumbers');
  let html = '';
  for (let i = 1; i <= Math.max(lines, 20); i++) html += '<div>' + i + '</div>';
  el.innerHTML = html;
}

// --- Syntax Highlighting ---
function updateHighlight() {
  const code = codeInput.value || '';
  const lang = currentFile?.language || 'plaintext';
  highlightLayer.innerHTML = highlight(code, lang) + '\n';
  // Match sizing
  highlightLayer.style.width = codeInput.scrollWidth + 'px';
}

function highlight(code, lang) {
  // Escape HTML first
  let s = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  if (lang === 'plaintext') return s;

  // Comments (single-line)
  s = s.replace(/(\/\/.*)/g, '<span class="hl-comment">$1</span>');
  s = s.replace(/(#(?![\da-f]{3,8}\b).*)/gi, function(m) {
    if (lang === 'python' || lang === 'bash' || lang === 'yaml' || lang === 'ruby') return '<span class="hl-comment">' + m + '</span>';
    return m;
  });
  // Strings
  s = s.replace(/(&quot;|"|')((?:(?!\1).)*?)\1/g, function(m) {
    if (m.includes('hl-comment')) return m;
    return '<span class="hl-string">' + m + '</span>';
  });
  s = s.replace(/(`[^`]*`)/g, '<span class="hl-string">$1</span>');
  // Numbers
  s = s.replace(/\b(\d+\.?\d*)\b/g, '<span class="hl-number">$1</span>');

  // Keywords per language
  let kw = [];
  if (lang === 'javascript' || lang === 'typescript') {
    kw = ['const','let','var','function','return','if','else','for','while','class','extends','import','export','from','default','async','await','new','this','try','catch','throw','typeof','instanceof','switch','case','break','continue','null','undefined','true','false','of','in','yield'];
  } else if (lang === 'python') {
    kw = ['def','class','return','if','elif','else','for','while','import','from','as','try','except','raise','with','yield','lambda','pass','break','continue','and','or','not','in','is','None','True','False','self','async','await','print'];
  } else if (lang === 'html') {
    // Tag highlighting
    s = s.replace(/(&lt;\/?)([\w-]+)/g, '$1<span class="hl-tag">$2</span>');
    s = s.replace(/\b([\w-]+)=/g, '<span class="hl-attr">$1</span>=');
  } else if (lang === 'css') {
    kw = ['important','inherit','initial','none','auto','block','inline','flex','grid','relative','absolute','fixed','hidden','visible','solid','dashed'];
    s = s.replace(/([\w-]+)\s*:/g, '<span class="hl-property">$1</span>:');
  } else if (lang === 'sql') {
    kw = ['SELECT','FROM','WHERE','INSERT','INTO','VALUES','UPDATE','SET','DELETE','CREATE','TABLE','ALTER','DROP','INDEX','JOIN','LEFT','RIGHT','INNER','OUTER','ON','AND','OR','NOT','NULL','PRIMARY','KEY','FOREIGN','REFERENCES','DEFAULT','ORDER','BY','GROUP','HAVING','LIMIT','OFFSET','AS','DISTINCT','COUNT','SUM','AVG','MIN','MAX','IF','EXISTS','CASE','WHEN','THEN','ELSE','END','IN','LIKE','BETWEEN','IS','CASCADE','UNIQUE','CHECK','CONSTRAINT','INT','VARCHAR','TEXT','BOOLEAN','TIMESTAMP','UUID'];
  } else if (lang === 'json') {
    s = s.replace(/("(?:[^"\\]|\\.)*")\s*:/g, '<span class="hl-property">$1</span>:');
  } else if (lang === 'markdown') {
    s = s.replace(/^(#{1,6}\s.*)$/gm, '<span class="hl-keyword">$1</span>');
    s = s.replace(/(\*\*.*?\*\*)/g, '<span class="hl-keyword">$1</span>');
  }

  if (kw.length) {
    const kwPat = new RegExp('\\b(' + kw.join('|') + ')\\b', 'g');
    // Avoid replacing inside existing spans
    const parts = s.split(/(<span[^>]*>.*?<\/span>)/g);
    s = parts.map(p => p.startsWith('<span') ? p : p.replace(kwPat, '<span class="hl-keyword">$1</span>')).join('');
  }

  // Function calls
  s = s.replace(/\b([a-zA-Z_]\w*)\s*\(/g, function(m, fn) {
    if (m.includes('hl-')) return m;
    return '<span class="hl-function">' + fn + '</span>(';
  });

  return s;
}

// --- Remote Cursors ---
function updateRemoteCursor(msg) {
  let el = remoteCursors[msg.userId];
  if (!el) {
    el = document.createElement('div');
    el.className = 'remote-cursor';
    el.style.background = msg.color;
    el.innerHTML = '<div class="remote-cursor-label" style="background:' + msg.color + ';color:#000">' + esc(msg.userName) + '</div>';
    document.getElementById('editorContainer').appendChild(el);
    remoteCursors[msg.userId] = el;
  }
  // Position based on line/col (approximate)
  const charW = 7.8; // approx char width at 13px JetBrains Mono
  const lineH = 20.8; // 13px * 1.6
  el.style.left = ((msg.col - 1) * charW + 8) + 'px';
  el.style.top = ((msg.line - 1) * lineH + 10) + 'px';

  // Update agent activity
  addAgentEvent(msg.userName, msg.color, 'cursor at line ' + msg.line);
}

function removeRemoteCursor(userId) {
  const el = remoteCursors[userId];
  if (el) { el.remove(); delete remoteCursors[userId]; }
}

// --- Agent Activity ---
function addAgentEvent(name, color, action) {
  const el = document.getElementById('agentActivity');
  const div = document.createElement('div');
  div.className = 'agent-event';
  div.innerHTML = '<span class="name" style="color:' + (color || 'var(--accent)') + '">' + esc(name) + '</span> ' + esc(action);
  el.prepend(div);
  // Keep max 50
  while (el.children.length > 50) el.lastChild.remove();
}

function updateUserCount() {
  // approximate from cursors
  const n = Object.keys(remoteCursors).length + 1;
  document.getElementById('statusUsers').textContent = n + ' user' + (n !== 1 ? 's' : '');
}

// --- UI Toggles ---
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }
function toggleAgentPanel() { document.getElementById('agentPanel').classList.toggle('collapsed'); }

// --- Util ---
function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// --- Init ---
updateLineNumbers();
connectWS();

// Auto-show project picker on load
setTimeout(() => { showProjectPicker(); }, 500);
</script>
</body>
</html>
