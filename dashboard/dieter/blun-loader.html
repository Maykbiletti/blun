<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BLUN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#f1f5f9;font-family:-apple-system,sans-serif;height:100dvh;display:flex;align-items:center;justify-content:center}
.box{width:100%;max-width:340px;padding:24px;text-align:center}
.logo{font-size:42px;font-weight:800;letter-spacing:2px;margin-bottom:4px}
.logo span{color:#3b82f6}
.sub{color:#94a3b8;font-size:14px;margin-bottom:24px}
input{display:block;width:100%;padding:14px 16px;margin-bottom:10px;background:#1e293b;border:1px solid #334155;border-radius:12px;color:#f1f5f9;font-size:16px;outline:none;-webkit-appearance:none}
input:focus{border-color:#3b82f6}
.btn{display:block;width:100%;padding:14px;background:#3b82f6;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer}
.btn:active{background:#2563eb}
#msg{min-height:20px;font-size:14px;margin-bottom:12px;color:#94a3b8}
#loading{display:none;text-align:center;padding:40px}
</style>
</head><body>
<div class="box" id="loginbox">
  <div class="logo">BL<span>UN</span></div>
  <div class="sub">AI Organisator</div>
  <input type="email" id="e" placeholder="Email" autocomplete="username">
  <input type="password" id="p" placeholder="Passwort" autocomplete="current-password">
  <div id="msg"></div>
  <button class="btn" id="loginbtn">Einloggen</button>
</div>
<div id="loading"><div class="logo">BL<span>UN</span></div><div class="sub" style="margin-top:12px">Lade App...</div></div>

<script>
var BASE = location.origin;
var msg = document.getElementById('msg');

// Check if already logged in
var t = localStorage.getItem('blun_token');
var u = localStorage.getItem('blun_user');
if (t && u) {
  // Verify token is still valid
  msg.textContent = 'Pruefe Login...';
  fetch(BASE + '/auth/me', { headers: { 'Authorization': 'Bearer ' + t } })
    .then(function(r) {
      if (r.ok) { loadApp(); }
      else { msg.textContent = 'Session abgelaufen. Bitte neu einloggen.'; msg.style.color = '#f59e0b'; }
    })
    .catch(function() { msg.textContent = ''; });
}

document.getElementById('loginbtn').addEventListener('click', doLogin);
document.getElementById('p').addEventListener('keydown', function(e) { if(e.key==='Enter') doLogin(); });

function doLogin() {
  var email = document.getElementById('e').value.trim();
  var pw = document.getElementById('p').value;
  if (!email || !pw) { msg.textContent = 'Email und Passwort eingeben'; msg.style.color = '#ef4444'; return; }
  msg.textContent = 'Verbinde...';
  msg.style.color = '#f59e0b';
  document.getElementById('loginbtn').disabled = true;

  fetch(BASE + '/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, password: pw })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.error) { msg.textContent = d.error; msg.style.color = '#ef4444'; document.getElementById('loginbtn').disabled = false; return; }
    if (!d.token) { msg.textContent = 'Fehler: Kein Token'; msg.style.color = '#ef4444'; document.getElementById('loginbtn').disabled = false; return; }
    localStorage.setItem('blun_token', d.token);
    localStorage.setItem('blun_user', JSON.stringify(d.user));
    msg.textContent = 'Eingeloggt!';
    msg.style.color = '#22c55e';
    loadApp();
  })
  .catch(function(e) {
    msg.textContent = 'Verbindungsfehler: ' + e.message;
    msg.style.color = '#ef4444';
    document.getElementById('loginbtn').disabled = false;
  });
}

function loadApp() {
  document.getElementById('loginbox').style.display = 'none';
  document.getElementById('loading').style.display = 'block';
  // Redirect to app with cache bust
  location.href = '/app?t=' + Date.now();
}
</script>
</body></html>
