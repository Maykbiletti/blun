<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:;">
    <title>BLUN Desktop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Login Screen -->
        <div id="loginScreen" class="screen active">
            <div class="login-container">
                <div class="logo">
                    <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                        <rect width="64" height="64" rx="12" fill="#6366F1"/>
                        <path d="M32 16L40 32L32 48L24 32L32 16Z" fill="white"/>
                    </svg>
                    <h1>BLUN</h1>
                </div>

                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="serverUrl">Server URL</label>
                        <input type="url" id="serverUrl" placeholder="https://api.blun.ai" required>
                    </div>

                    <div class="form-group">
                        <label for="apiKey">API Key</label>
                        <input type="password" id="apiKey" placeholder="Enter your API key" required>
                        <button type="button" class="toggle-password" data-target="apiKey">👁</button>
                    </div>

                    <div class="form-group checkbox-group">
                        <label>
                            <input type="checkbox" id="rememberLogin">
                            <span class="checkmark"></span>
                            Remember me
                        </label>
                    </div>

                    <button type="submit" class="login-btn">Connect to BLUN</button>
                </form>

                <div class="login-footer">
                    <p>Need an API key? <a href="#" onclick="openExternal('https://blun.ai/api-keys')">Get one here</a></p>
                </div>
            </div>
        </div>

        <!-- Main Chat Interface -->
        <div id="chatScreen" class="screen">
            <div class="chat-container">
                <!-- Sidebar -->
                <div class="sidebar">
                    <div class="sidebar-header">
                        <div class="user-info">
                            <div class="avatar">B</div>
                            <div class="user-details">
                                <span class="username">BLUN User</span>
                                <span class="status online">Online</span>
                            </div>
                        </div>
                        <button class="new-chat-btn" title="New Chat">+</button>
                    </div>

                    <div class="chat-history">
                        <div class="chat-item active">
                            <div class="chat-preview">
                                <h4>Welcome Chat</h4>
                                <p>How can I help you today?</p>
                                <span class="timestamp">Just now</span>
                            </div>
                        </div>
                    </div>

                    <div class="sidebar-footer">
                        <button class="settings-btn" title="Settings">⚙️</button>
                        <button class="logout-btn" title="Logout">🚪</button>
                        <button class="minimize-btn" title="Minimize to Tray">➖</button>
                    </div>
                </div>

                <!-- Chat Area -->
                <div class="chat-area">
                    <div class="chat-header">
                        <h2>Chat</h2>
                        <div class="chat-actions">
                            <button class="action-btn" title="Clear Chat">🗑️</button>
                            <button class="action-btn" title="Export Chat">📤</button>
                        </div>
                    </div>

                    <div class="messages-container">
                        <div id="messages"></div>
                    </div>

                    <div class="input-area">
                        <div class="input-container">
                            <textarea
                                id="messageInput"
                                placeholder="Type your message... (Shift+Enter for new line)"
                                rows="1"
                            ></textarea>
                            <button id="sendBtn" class="send-btn" title="Send message">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/>
                                </svg>
                            </button>
                        </div>
                        <div class="input-hints">
                            <span>Press Enter to send, Shift+Enter for new line</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settingsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Settings</h2>
                    <button class="close-modal">×</button>
                </div>
                <div class="modal-body">
                    <div class="settings-section">
                        <h3>Connection</h3>
                        <div class="form-group">
                            <label for="settingsServerUrl">Server URL</label>
                            <input type="url" id="settingsServerUrl">
                        </div>
                        <div class="form-group">
                            <label for="settingsApiKey">API Key</label>
                            <input type="password" id="settingsApiKey">
                        </div>
                    </div>

                    <div class="settings-section">
                        <h3>Appearance</h3>
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="darkMode">
                                Dark Mode
                            </label>
                        </div>
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="startMinimized">
                                Start Minimized to Tray
                            </label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn-secondary" id="cancelSettings">Cancel</button>
                    <button class="btn-primary" id="saveSettings">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
