<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{siteName}}</title>
<link href="https://fonts.googleapis.com/css2?family={{font}}:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:{{primary}};--bg:{{background}};--card:{{card}};--text:{{textColor}};--muted:{{muted}}}
body{font-family:'{{font}}',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:var(--primary);text-decoration:none}
.container{max-width:1100px;margin:0 auto;padding:0 24px}
.hero{padding:120px 24px 80px;text-align:center}
.hero h1{font-size:clamp(2.5rem,5vw,4rem);font-weight:700;letter-spacing:-0.03em;margin-bottom:12px}
.hero p{color:var(--muted);font-size:1.15rem}
.section{padding:80px 0}
.section h2{font-size:1.75rem;font-weight:600;margin-bottom:40px;letter-spacing:-0.02em}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.gallery-item{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:12px;overflow:hidden;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;position:relative}
.gallery-item .placeholder{width:100%;height:100%;background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(245,158,11,.05));display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px}
.gallery-item .placeholder span{font-weight:600;font-size:1rem}
.gallery-item .cat{position:absolute;top:12px;right:12px;background:var(--primary);color:#000;font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:20px}
.about-section{border-top:1px solid rgba(255,255,255,.06)}
.about-section .inner{max-width:700px}
.about-section p{color:var(--muted);font-size:1.05rem;line-height:1.8}
.contact-section{border-top:1px solid rgba(255,255,255,.06)}
.contact-section a{font-size:1.1rem}
footer{padding:40px 0;text-align:center;color:var(--muted);font-size:.85rem;border-top:1px solid rgba(255,255,255,.06)}
</style>
</head>
<body>
<script>var SECTIONS = {{sectionsJSON}};</script>

<section class="hero"><h1 id="hero-h"></h1><p id="hero-p"></p></section>

<section class="section container" id="gallery-section">
  <h2 id="gallery-title"></h2>
  <div class="gallery-grid" id="gallery-grid"></div>
</section>

<section class="section about-section">
  <div class="container inner">
    <h2 id="about-title"></h2>
    <p id="about-text"></p>
  </div>
</section>

<section class="section contact-section">
  <div class="container">
    <h2 id="contact-title"></h2>
    <a id="contact-email" href=""></a>
  </div>
</section>

<footer><div class="container" id="footer-text"></div></footer>

<script>
(function(){
  var s = SECTIONS;
  if(s.hero){document.getElementById('hero-h').textContent=s.hero.headline||'';document.getElementById('hero-p').textContent=s.hero.subheadline||'';}
  if(s.gallery){
    document.getElementById('gallery-title').textContent=s.gallery.title||'';
    var g=document.getElementById('gallery-grid');
    (s.gallery.items||[]).forEach(function(i){
      var d=document.createElement('div');d.className='gallery-item';
      d.innerHTML='<div class="placeholder"><span>'+i.title+'</span></div><span class="cat">'+i.category+'</span>';
      g.appendChild(d);
    });
  }
  if(s.about){document.getElementById('about-title').textContent=s.about.title||'';document.getElementById('about-text').textContent=s.about.text||'';}
  if(s.contact){document.getElementById('contact-title').textContent=s.contact.title||'';var e=document.getElementById('contact-email');e.textContent=s.contact.email||'';e.href='mailto:'+(s.contact.email||'');}
  if(s.footer)document.getElementById('footer-text').textContent=s.footer.text||'';
})();
</script>
</body>
</html>
