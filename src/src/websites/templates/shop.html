<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{siteName}}</title>
<link href="https://fonts.googleapis.com/css2?family={{font}}:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:{{primary}};--bg:{{background}};--card:{{card}};--text:{{textColor}};--muted:{{muted}}}
body{font-family:'{{font}}',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:var(--primary);text-decoration:none}
.container{max-width:1100px;margin:0 auto;padding:0 24px}
header{padding:24px 0;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between}
header h1{font-size:1.25rem;font-weight:700}
header p{color:var(--muted);font-size:.85rem}
.cart-btn{background:var(--card);border:1px solid rgba(255,255,255,.06);padding:8px 20px;border-radius:8px;color:var(--text);font-size:.9rem;cursor:pointer;font-family:inherit;transition:border-color .2s}
.cart-btn:hover{border-color:var(--primary)}
.products{padding:60px 0}
.products h2{font-size:1.5rem;font-weight:600;margin-bottom:32px}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px}
.product-card{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:12px;overflow:hidden;transition:border-color .2s}
.product-card:hover{border-color:var(--primary)}
.product-img{aspect-ratio:1;background:linear-gradient(135deg,rgba(245,158,11,.1),rgba(245,158,11,.03));display:flex;align-items:center;justify-content:center;font-size:.9rem;color:var(--muted)}
.product-info{padding:20px}
.product-info h3{font-size:1rem;font-weight:600;margin-bottom:4px}
.product-info .desc{color:var(--muted);font-size:.85rem;margin-bottom:12px}
.product-info .price-row{display:flex;align-items:center;justify-content:space-between}
.product-info .price{font-size:1.1rem;font-weight:700;color:var(--primary)}
.add-btn{background:var(--primary);color:#000;border:none;padding:8px 16px;border-radius:6px;font-weight:600;font-size:.8rem;cursor:pointer;font-family:inherit;transition:opacity .2s}
.add-btn:hover{opacity:.85}
/* Cart drawer */
.cart-drawer{position:fixed;top:0;right:-400px;width:400px;max-width:100vw;height:100vh;background:var(--card);border-left:1px solid rgba(255,255,255,.06);z-index:100;transition:right .3s;padding:32px;display:flex;flex-direction:column}
.cart-drawer.open{right:0}
.cart-drawer h2{font-size:1.25rem;font-weight:600;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center}
.cart-drawer .close{background:none;border:none;color:var(--muted);font-size:1.5rem;cursor:pointer}
.cart-empty{color:var(--muted);flex:1;display:flex;align-items:center;justify-content:center}
.cart-items{flex:1;overflow-y:auto}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.cart-total{padding:20px 0;border-top:1px solid rgba(255,255,255,.06);font-size:1.1rem;font-weight:600;display:flex;justify-content:space-between}
.checkout-btn{width:100%;padding:14px;background:var(--primary);color:#000;border:none;border-radius:8px;font-weight:600;font-size:1rem;cursor:pointer;margin-top:12px;font-family:inherit}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;display:none}
.overlay.open{display:block}
footer{padding:40px 0;text-align:center;color:var(--muted);font-size:.85rem;border-top:1px solid rgba(255,255,255,.06)}
</style>
</head>
<body>
<script>var SECTIONS = {{sectionsJSON}};</script>

<div class="container">
  <header>
    <div><h1 id="hdr-title"></h1><p id="hdr-tag"></p></div>
    <button class="cart-btn" onclick="toggleCart()">Cart (<span id="cart-count">0</span>)</button>
  </header>
</div>

<section class="products container">
  <h2>Products</h2>
  <div class="product-grid" id="product-grid"></div>
</section>

<div class="overlay" id="overlay" onclick="toggleCart()"></div>
<div class="cart-drawer" id="cart-drawer">
  <h2>Cart <button class="close" onclick="toggleCart()">&times;</button></h2>
  <div class="cart-items" id="cart-items"><div class="cart-empty" id="cart-empty"></div></div>
  <div class="cart-total" id="cart-total" style="display:none"><span>Total</span><span id="total-price">$0.00</span></div>
  <button class="checkout-btn" id="checkout-btn" style="display:none">Checkout</button>
</div>

<footer><div class="container" id="footer-text"></div></footer>

<script>
(function(){
  var s=SECTIONS, cart=[];
  if(s.header){document.getElementById('hdr-title').textContent=s.header.title||'';document.getElementById('hdr-tag').textContent=s.header.tagline||'';}
  if(s.cart)document.getElementById('cart-empty').textContent=s.cart.empty_text||'Your cart is empty';
  if(s.products){
    var g=document.getElementById('product-grid');
    (s.products.items||[]).forEach(function(p,i){
      var d=document.createElement('div');d.className='product-card';
      d.innerHTML='<div class="product-img">'+p.name+'</div><div class="product-info"><h3>'+p.name+'</h3><p class="desc">'+p.description+'</p><div class="price-row"><span class="price">$'+p.price+'</span><button class="add-btn" data-idx="'+i+'">Add to Cart</button></div></div>';
      g.appendChild(d);
    });
    g.addEventListener('click',function(e){
      if(e.target.classList.contains('add-btn')){
        var idx=parseInt(e.target.dataset.idx);
        cart.push(s.products.items[idx]);
        updateCart();
      }
    });
  }
  if(s.footer)document.getElementById('footer-text').textContent=s.footer.text||'';

  window.toggleCart=function(){
    document.getElementById('cart-drawer').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('open');
  };

  function updateCart(){
    document.getElementById('cart-count').textContent=cart.length;
    var ci=document.getElementById('cart-items');
    if(cart.length===0){ci.innerHTML='<div class="cart-empty">'+(s.cart?s.cart.empty_text:'Empty')+'</div>';document.getElementById('cart-total').style.display='none';document.getElementById('checkout-btn').style.display='none';return;}
    var h='';var total=0;
    cart.forEach(function(p,i){h+='<div class="cart-item"><span>'+p.name+'</span><span>$'+p.price+'</span></div>';total+=parseFloat(p.price);});
    ci.innerHTML=h;
    document.getElementById('cart-total').style.display='flex';
    document.getElementById('total-price').textContent='$'+total.toFixed(2);
    document.getElementById('checkout-btn').style.display='block';
  }
})();
</script>
</body>
</html>
