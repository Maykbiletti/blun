<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{siteName}}</title>
<link href="https://fonts.googleapis.com/css2?family={{font}}:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:{{primary}};--bg:{{background}};--card:{{card}};--text:{{textColor}};--muted:{{muted}}}
body{font-family:'{{font}}',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:var(--primary);text-decoration:none}
.container{max-width:1100px;margin:0 auto;padding:0 24px}
.hero{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:80px 24px}
.hero h1{font-size:clamp(2.5rem,5vw,4rem);font-weight:700;letter-spacing:-0.03em;margin-bottom:16px}
.hero p{color:var(--muted);font-size:1.2rem;max-width:600px;margin:0 auto}
.section{padding:80px 0;border-top:1px solid rgba(255,255,255,.06)}
.section h2{font-size:1.75rem;font-weight:600;margin-bottom:48px;letter-spacing:-0.02em;text-align:center}
.services-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.service-card{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:32px}
.service-card h3{font-size:1.125rem;font-weight:600;margin-bottom:8px;color:var(--primary)}
.service-card p{color:var(--muted);font-size:.95rem}
.team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.team-card{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:32px;text-align:center}
.team-avatar{width:80px;height:80px;border-radius:50%;background:rgba(245,158,11,.15);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;color:var(--primary)}
.team-card h3{font-size:1.05rem;font-weight:600;margin-bottom:4px}
.team-card .role{color:var(--primary);font-size:.85rem;font-weight:500;margin-bottom:12px}
.team-card p{color:var(--muted);font-size:.9rem}
.contact-info{max-width:500px;margin:0 auto;text-align:center}
.contact-info p{color:var(--muted);margin-bottom:8px;font-size:1rem}
footer{padding:40px 0;text-align:center;color:var(--muted);font-size:.85rem;border-top:1px solid rgba(255,255,255,.06)}
</style>
</head>
<body>
<script>var SECTIONS = {{sectionsJSON}};</script>

<section class="hero"><div><h1 id="hero-h"></h1><p id="hero-p"></p></div></section>

<section class="section"><div class="container"><h2 id="srv-title"></h2><div class="services-grid" id="srv-grid"></div></div></section>

<section class="section"><div class="container"><h2 id="team-title"></h2><div class="team-grid" id="team-grid"></div></div></section>

<section class="section"><div class="container"><h2 id="contact-title"></h2><div class="contact-info" id="contact-info"></div></div></section>

<footer><div class="container" id="footer-text"></div></footer>

<script>
(function(){
  var s=SECTIONS;
  if(s.hero){document.getElementById('hero-h').textContent=s.hero.headline||'';document.getElementById('hero-p').textContent=s.hero.subheadline||'';}
  if(s.services){
    document.getElementById('srv-title').textContent=s.services.title||'';
    var g=document.getElementById('srv-grid');
    (s.services.items||[]).forEach(function(i){var d=document.createElement('div');d.className='service-card';d.innerHTML='<h3>'+i.title+'</h3><p>'+i.description+'</p>';g.appendChild(d);});
  }
  if(s.team){
    document.getElementById('team-title').textContent=s.team.title||'';
    var tg=document.getElementById('team-grid');
    (s.team.members||[]).forEach(function(m){var d=document.createElement('div');d.className='team-card';d.innerHTML='<div class="team-avatar">'+m.name.charAt(0)+'</div><h3>'+m.name+'</h3><div class="role">'+m.role+'</div><p>'+m.bio+'</p>';tg.appendChild(d);});
  }
  if(s.contact){
    document.getElementById('contact-title').textContent=s.contact.title||'';
    var ci=document.getElementById('contact-info');
    ci.innerHTML='<p>'+s.contact.email+'</p><p>'+s.contact.phone+'</p><p>'+s.contact.address+'</p>';
  }
  if(s.footer)document.getElementById('footer-text').textContent=s.footer.text||'';
})();
</script>
</body>
</html>
