<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLUN -- AI Organisator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .logo {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 8px;
      margin-bottom: 32px;
      color: #3b82f6;
    }
    .status {
      font-size: 14px;
      color: #666;
      margin-top: 24px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="logo">BLUN</div>
  <div class="spinner"></div>
  <div class="status" id="status">Starting...</div>
  <script>
    var serverUrl = "http://localhost:3200";
    var statusEl = document.getElementById("status");
    var attempts = 0;

    function checkServer() {
      attempts++;
      fetch(serverUrl, { mode: "no-cors" })
        .then(function () {
          statusEl.textContent = "Connected. Loading...";
          window.location.href = serverUrl;
        })
        .catch(function () {
          if (attempts > 120) {
            statusEl.textContent = "Server failed to start. Please restart the application.";
            return;
          }
          statusEl.textContent = "Starting... (" + attempts + "s)";
          setTimeout(checkServer, 500);
        });
    }

    setTimeout(checkServer, 500);
  </script>
</body>
</html>
